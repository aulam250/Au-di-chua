<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#3b2340">
<title>Cả nhà Lên Chùa</title>
<script type="importmap">
{ "imports": { 
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<style>
/* ===== GIAO DIỆN: biến màu, bố cục, nút, bảng ===== */
:root{
  --ink:#33201a; --ink2:#6d5343; --paper:#fff6e5; --paper2:#f6e6cb; --line:#e3cda8;
  --gold:#e9b44c; --gold2:#b8862c; --red:#a5301f; --red2:#7f2115; --lam:#5f7fa8;
  --serif:Georgia,"Times New Roman","Noto Serif",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2a1a30;color:var(--ink);font-family:var(--sans);
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input,textarea{font:inherit;-webkit-user-select:text;user-select:text}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.hide{display:none!important}

/* Nút chung */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:14px;
  font-weight:700;font-size:17px;background:var(--paper2);color:var(--ink);transition:transform .12s,filter .12s}
.btn:active{transform:scale(.97);filter:brightness(.95)}
.btn.main{background:linear-gradient(180deg,#c2402a,var(--red));color:#fff3dc;box-shadow:0 3px 0 var(--red2)}
.btn.ghost{background:transparent;color:var(--ink2);font-weight:600}
.btn.wide{width:100%}
.btn[disabled]{opacity:.55;cursor:default}
.row{display:flex;gap:10px}
.row>.btn{flex:1;padding:0 12px}

/* Màn chào */
#welcome{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:calc(7vh + var(--sat)) 22px calc(18px + var(--sab));text-align:center;color:#fff3dc;overflow:hidden;
  background:linear-gradient(180deg,#2e2a5c 0%,#6e3d6e 24%,#d9694f 42%,#f7a95f 54%,#3a2030 54.2%,#25151f 100%);transition:opacity .7s}
#welcome.out{opacity:0;pointer-events:none}
#welcome svg.sil{position:absolute;left:50%;top:54%;width:min(620px,112vw);transform:translate(-50%,-99.5%);pointer-events:none}
#welcome .sun{position:absolute;left:50%;top:54%;width:200px;height:200px;margin:-150px 0 0 -100px;border-radius:50%;clip-path:inset(0 0 50px 0);
  background:radial-gradient(circle,#ffe2a1 0,#ffc069 45%,rgba(255,170,90,0) 70%);pointer-events:none}
.wbox{position:relative;width:min(380px,100%);height:100%;display:flex;flex-direction:column;gap:11px}
.wbox .game{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#ffdfa6}
.wbox h1{font-family:var(--serif);font-weight:700;font-size:clamp(32px,10.2vw,50px);white-space:nowrap;line-height:1.1;margin:0;text-shadow:0 2px 14px rgba(40,10,40,.55)}
.wform{margin-top:auto;display:flex;flex-direction:column;gap:11px}
.wbox label{font-size:15px;text-align:left;color:#ffe9c9}
.wbox input{height:52px;border-radius:14px;border:2px solid rgba(255,230,190,.65);background:rgba(255,246,229,.96);padding:0 16px;
  font-size:18px;color:var(--ink);width:100%}
.wbox .btn.main{min-height:60px;font-size:21px;font-family:var(--serif)}
#wstatus{min-height:20px;font-size:14px;color:#ffe2b8}
.wnote{font-size:12.5px;color:#d9c1a6;line-height:1.45}
/* Chọn diện mạo (màn chào và Sổ) */
.looks{display:flex;flex-direction:column;gap:7px}
.lrow{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid rgba(255,240,210,.55)}
.sw.sel{border-color:#ffe2a6;box-shadow:0 0 0 3px rgba(165,48,31,.95)}
.sw.sm{width:30px;height:30px}
.hc{min-height:34px;padding:0 11px;border-radius:17px;background:rgba(255,246,229,.16);color:#ffe9c9;font-size:13.5px;font-weight:600;border:2px solid transparent}
.hc.sel{background:#fff0d8;color:var(--ink);border-color:var(--gold)}
.lname{font-size:13px;color:#ffe2b8;min-height:16px;text-align:center}
.wbox label.fam,.fam{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14.5px;color:#ffe9c9;text-align:center}
.fam input{width:20px;height:20px;accent-color:var(--red)}
.pagemain .hc{background:var(--paper2);color:var(--ink)} .pagemain .hc.sel{background:#fff0e3;border-color:var(--red)}
.pagemain .sw{border-color:var(--line)} .pagemain .sw.sel{border-color:var(--gold2)}
.pagemain .lname{color:var(--ink2)} .pagemain .wbox label.fam,.pagemain .fam{color:var(--ink)}

/* HUD */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none}
#counter{position:absolute;left:calc(10px + var(--sal));top:calc(10px + var(--sat));max-width:calc(100vw - 245px);padding:7px 11px;border-radius:12px;
  background:rgba(40,22,30,.62);color:#ffeccb;font-size:12.5px;line-height:1.3;backdrop-filter:blur(3px)}
#counter b{color:var(--gold);font-weight:700}
#netLine{margin-top:3px;color:#a9e6d6}
#clockLine{margin-top:2px;color:#ffe2a6}
#tools{position:absolute;right:calc(10px + var(--sar));top:calc(10px + var(--sat));display:flex;gap:7px;pointer-events:auto}
.tool{min-width:46px;height:46px;padding:0 10px;border-radius:12px;background:rgba(40,22,30,.72);color:#ffeccb;font-size:13px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:5px}
.tool svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#joy{position:absolute;left:calc(20px + var(--sal));bottom:calc(24px + var(--sab));width:136px;height:136px;border-radius:50%;pointer-events:auto;touch-action:none;
  background:radial-gradient(circle,rgba(255,240,210,.14) 40%,rgba(255,240,210,.28));border:2px solid rgba(255,240,210,.5)}
#moodBtn{position:absolute;left:calc(20px + var(--sal));bottom:calc(176px + var(--sab));min-height:42px;max-width:min(62vw,300px);padding:0 14px 0 10px;border-radius:21px;pointer-events:auto;
  background:rgba(40,22,30,.72);color:#ffeccb;font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
#moodBtn svg{flex:none;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#mapBtn{position:absolute;left:calc(20px + var(--sal));bottom:calc(228px + var(--sab));min-height:42px;padding:0 14px 0 10px;border-radius:21px;pointer-events:auto;background:rgba(40,22,30,.72);color:#ffeccb;font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
#xkActBtn{display:none;position:absolute;left:calc(20px + var(--sal));bottom:calc(280px + var(--sab));min-height:46px;padding:0 16px 0 12px;border-radius:23px;pointer-events:auto;background:linear-gradient(180deg,#d8503a,#a82a1a);color:#fff3dc;font-size:15px;font-weight:700;align-items:center;gap:6px;border:1px solid rgba(255,230,180,.5);box-shadow:0 6px 18px rgba(120,20,10,.35)}
body.xk #xkActBtn{display:flex} body.busy #xkActBtn{display:none}
#mapBtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#moodBtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#moodBtn.on{background:rgba(255,246,229,.92);color:var(--ink);box-shadow:0 0 0 2px var(--gold)}
#moodText{width:100%;height:52px;border-radius:14px;border:2px solid var(--line);padding:0 13px;font-size:17px;background:#fff;color:var(--ink)}
@media (min-width:820px) and (pointer:fine){ #moodBtn{bottom:calc(24px + var(--sab))} #mapBtn{bottom:calc(76px + var(--sab))} #xkActBtn{bottom:calc(128px + var(--sab))} }
#knob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#fff4dc,#d9b98a);box-shadow:0 3px 10px rgba(0,0,0,.35);pointer-events:none}
#action{position:absolute;right:calc(18px + var(--sar));bottom:calc(36px + var(--sab));min-width:150px;max-width:56vw;min-height:84px;padding:10px 20px;border-radius:24px;pointer-events:auto;
  background:linear-gradient(180deg,#d24b2f,var(--red));color:#fff3dc;font-family:var(--serif);font-weight:700;font-size:21px;line-height:1.15;
  box-shadow:0 4px 0 var(--red2),0 0 0 4px rgba(233,180,76,.75),0 8px 26px rgba(0,0,0,.4);animation:breath 1.8s ease-in-out infinite}
#action:active{transform:translateY(2px)}
@keyframes breath{50%{box-shadow:0 4px 0 var(--red2),0 0 0 8px rgba(233,180,76,.4),0 8px 26px rgba(0,0,0,.4)}}
body.busy #joy,body.busy #moodBtn,body.busy #mapBtn,body.busy #action,body.busy #tools,body.busy #counter,body.busy #toast{display:none}
#caption{position:absolute;left:50%;top:calc(66px + var(--sat));transform:translateX(-50%);max-width:88vw;padding:9px 18px;border-radius:14px;background:rgba(40,22,30,.72);
  color:#fff0d2;font-family:var(--serif);font-size:18px;text-align:center;opacity:0;transition:opacity .35s}
#caption.on{opacity:1}
#toast{position:absolute;left:50%;bottom:calc(178px + var(--sab));transform:translateX(-50%);width:max-content;max-width:88vw;padding:10px 16px;border-radius:14px;background:rgba(40,22,30,.86);
  color:#fff0d2;font-size:14.5px;line-height:1.35;text-align:center;opacity:0;transition:opacity .35s}
#toast.on{opacity:1}
.bub{position:absolute;left:0;top:0;max-width:170px;padding:6px 10px;border-radius:12px 12px 12px 3px;background:rgba(255,248,232,.95);color:var(--ink);font-size:13px;line-height:1.25;
  box-shadow:0 2px 8px rgba(0,0,0,.28);opacity:0;transition:opacity .3s;will-change:transform;white-space:normal;width:max-content}
.bub.on{opacity:1}

/* Bảng trượt dưới màn */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;pointer-events:none;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.3,1)}
#sheet.on{transform:none}
#sheetBody{pointer-events:auto;width:min(520px,100%);max-height:86vh;max-height:86dvh;overflow:auto;padding:20px 18px calc(18px + var(--sab));border-radius:22px 22px 0 0;background:var(--paper);
  box-shadow:0 -8px 30px rgba(0,0,0,.35);-webkit-overflow-scrolling:touch}
.sheet-title{font-family:var(--serif);font-size:24px;font-weight:700;margin:0 0 6px;color:var(--red2)}
.sheet-sub{margin:0 0 14px;color:var(--ink2);font-size:15px;line-height:1.45}
.small{font-size:12.5px;color:var(--ink2);line-height:1.4}
.choice{display:flex;gap:10px;margin:0 0 12px}
.choice button{flex:1;min-height:86px;border-radius:16px;background:#fff;border:2px solid var(--line);padding:10px 6px;font-weight:700;font-size:16px;line-height:1.25}
.choice button small{display:block;font-weight:500;color:var(--ink2);font-size:12.5px;margin-top:3px}
.choice button.sel{border-color:var(--red);background:#fff0e3;box-shadow:0 0 0 2px var(--red) inset}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 10px}
.chips button{min-height:38px;padding:0 13px;border-radius:19px;background:var(--paper2);font-size:14px;font-weight:600}
textarea{width:100%;height:96px;resize:none;border-radius:14px;border:2px solid var(--line);padding:11px 13px;font-size:17px;background:#fff;color:var(--ink);line-height:1.35}
.count{text-align:right;font-size:12.5px;color:var(--ink2);margin:3px 2px 9px}
.warn{color:var(--red);font-size:14px;margin:0 0 9px;min-height:0}
.score{font-family:var(--serif);font-size:64px;line-height:1;color:var(--red);text-align:center;margin:8px 0 2px}
.score small{font-size:17px;color:var(--ink2)}
.tally{display:flex;justify-content:center;gap:14px;font-size:14px;color:var(--ink2);margin:8px 0 12px;flex-wrap:wrap}
.praise{font-family:var(--serif);font-size:18px;line-height:1.45;text-align:center;margin:6px 0 14px}

/* Ống xăm */
#tube{position:relative;width:120px;height:190px;margin:4px auto 10px}
#tube .sticks{position:absolute;left:18px;right:18px;top:0;height:90px;display:flex;justify-content:space-between;align-items:flex-end}
#tube .sticks i{display:block;width:6px;background:#d8b67c;border-radius:3px 3px 0 0;height:80px}
#tube .sticks i:nth-child(2n){height:66px;background:#c9a266}#tube .sticks i:nth-child(3n){height:88px}
#tube .body{position:absolute;left:8px;right:8px;bottom:0;height:130px;border-radius:10px 10px 16px 16px;background:linear-gradient(90deg,#74231a,#b23a26 40%,#8c2a1b);
  border-top:7px solid var(--gold);border-bottom:7px solid var(--gold);display:flex;align-items:center;justify-content:center;color:#ffe2a9;font-family:var(--serif);font-size:19px;writing-mode:vertical-rl}
#tube.shake{animation:tubeshake .22s linear infinite}
@keyframes tubeshake{25%{transform:rotate(-7deg) translateY(-2px)}75%{transform:rotate(7deg) translateY(2px)}}
#drop{position:absolute;left:50%;top:-36px;width:16px;height:96px;margin-left:-8px;border-radius:4px;background:linear-gradient(#e2c189,#c79f62);box-shadow:0 2px 5px rgba(0,0,0,.3);opacity:0}
#drop.go{animation:dropstick .9s ease-in forwards}
@keyframes dropstick{0%{opacity:1;transform:translateY(0)}50%{opacity:1;transform:translateY(-40px) rotate(14deg)}100%{opacity:1;transform:translateY(190px) rotate(80deg)}}
.bar{height:12px;border-radius:6px;background:var(--paper2);overflow:hidden;margin:0 0 12px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--red))}
.card{border:2px solid var(--gold2);border-radius:16px;padding:18px 16px;background:linear-gradient(180deg,#fff,#fff3dc);text-align:center;margin:0 0 12px;animation:cardin .5s ease-out}
@keyframes cardin{from{transform:rotateY(70deg) scale(.9);opacity:0}}
.card .no{color:var(--red);font-weight:700;font-size:14px;letter-spacing:.06em}
.card p{font-family:var(--serif);font-size:20px;line-height:1.45;margin:9px 0 10px}
#holdBtn{touch-action:none;-webkit-touch-callout:none}
/* Chụp ảnh: chớp đèn, đếm ngược, ảnh in xem trước */
#warp{position:fixed;inset:0;z-index:29;pointer-events:none;opacity:0;transition:opacity 1s;display:flex;align-items:center;justify-content:center;overflow:hidden}
#warp.on{opacity:1} #warp.soft{opacity:.55} #warp.soft #warpText{display:none}
#warp .sw{position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg,#fff6e0 0 12deg,#9fd8ff 12deg 24deg,#f3c15d 24deg 36deg);filter:blur(18px);animation:warpSpin 3s linear infinite}
#warp.soft .sw{animation-duration:9s}
#warp::after{content:'';position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.8) 0,rgba(255,255,255,.1) 35%,transparent 60%)}
#warpText{position:relative;z-index:1;font-family:var(--serif);font-weight:700;font-size:clamp(26px,7vw,48px);color:#7a1e12;text-shadow:0 2px 12px #fff;padding:0 20px;text-align:center;margin-bottom:38vh}
@keyframes warpSpin{to{transform:rotate(360deg)}}
#xkHud{display:none;position:absolute;left:calc(10px + var(--sal));top:calc(10px + var(--sat));max-width:calc(100vw - 245px);padding:8px 12px;border-radius:16px;background:var(--glass-dark,rgba(34,18,28,.62));color:#ffeccb;font-size:14px;line-height:1.35;pointer-events:none;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
#xkHud b{color:#f3c15d} body.xk #xkHud{display:block} body.xk #counter{display:none}
/* Nhân Sinh Ký Sự: trang giấy dó, chữ serif, triện đỏ */
#chron{position:fixed;inset:0;z-index:32;display:none;overflow:auto;-webkit-overflow-scrolling:touch;background:radial-gradient(120% 80% at 50% 0%,#f8f2e4 0%,#efe6d2 60%,#e6dbc3 100%);color:#2f3b2f;font-family:var(--serif)}
#chron.on{display:block;animation:pageIn .5s cubic-bezier(.32,.72,0,1)}
#chron .ch-wrap{max-width:560px;margin:0 auto;padding:calc(22px + var(--sat)) 18px calc(28px + var(--sab))}
#chron .ch-seal{width:70px;height:70px;margin:4px auto 10px;border-radius:50%;border:2px solid #c9a24f;display:flex;align-items:center;justify-content:center;font-size:34px;color:#2f5a3f;box-shadow:inset 0 0 0 6px rgba(201,162,79,.15)}
#chron .ch-kicker{text-align:center;font:600 12px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;letter-spacing:.18em;color:#a07a35}
#chron h2{text-align:center;font-size:clamp(30px,8vw,42px);margin:6px 0 4px;color:#2f5a3f}
#chron .ch-sub{text-align:center;margin:0 0 14px;color:#7a6a52;font-style:italic}
#chron .ch-card{background:rgba(255,252,244,.8);border:1px solid #dccca8;border-radius:16px;padding:14px 16px;box-shadow:0 6px 24px rgba(90,70,30,.08)}
#chron .ch-name{font-size:26px;font-weight:700;color:#7a1e12;text-align:center}
#chron .ch-role{text-align:center;color:#6a5a42;margin:2px 0 10px;font-size:15px}
#chron .ch-row{position:relative;display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid rgba(160,130,80,.18);font-size:15px}
#chron .ch-row span{color:#7a6a52;font-family:-apple-system,Segoe UI,Roboto,sans-serif;font-size:13px} #chron .ch-row b{text-align:right;color:#2f3b2f}
#chron .ch-row i{position:absolute;left:0;bottom:-1px;height:2px;background:linear-gradient(90deg,#c9a24f,#2f5a3f);transition:width .6s}
#chron .ch-ctrl{position:sticky;bottom:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:14px -18px 0;padding:10px 18px calc(10px + var(--sab));background:linear-gradient(180deg,rgba(239,230,210,.8),#efe6d2 35%);font:13px -apple-system,Segoe UI,Roboto,sans-serif;color:#7a6a52}
#chron .ch-ctrl button{flex:1;min-height:48px!important;font-size:16px!important} #chron .ch-ctrl small{flex-basis:100%;text-align:center;font-size:12px}
#chron .ch-ctrl button{min-height:34px;padding:0 12px;border-radius:17px;border:1px solid #cdbb92;background:#fffaf0;color:#2f5a3f;font-weight:700}
#chron .ch-ctrl button.on{background:#2f5a3f;color:#fff6e0;border-color:#2f5a3f}
#chron .ch-time{display:flex;flex-direction:column;gap:8px}
#chron .ch-ev{display:flex;gap:12px;padding:10px 12px;border-radius:12px;background:rgba(255,252,244,.75);border-left:4px solid #9aa88a;animation:pageIn .4s}
#chron .ch-ev.c-cd{border-left-color:#c9a24f} #chron .ch-ev.c-hh{border-left-color:#b5482a} #chron .ch-ev.c-lc{border-left-color:#3a6aa0} #chron .ch-ev.c-kc{border-left-color:#7a1e12;background:#fff4dc}
#chron .ch-age{min-width:40px;text-align:center;font-size:24px;font-weight:700;color:#2f5a3f;line-height:1} #chron .ch-age small{display:block;font-size:11px;color:#8a7a5a}
#chron .ch-ev b{font-size:15px;color:#6a3a1a} #chron .ch-ev p{margin:3px 0 0;font-size:15px;line-height:1.45}
#chron .ch-sum{margin:14px 0 10px;padding:12px;border:1px dashed #c9a24f;border-radius:12px;text-align:center}
#chron .ch-sum div{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:8px 0} #chron .ch-sum span{padding:3px 10px;border-radius:12px;background:#efe3c6;font-size:13px}
#chron .ch-sum p{margin:6px 0 0}
#chron .ch-modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(40,50,40,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#chron .ch-modal.on{display:flex}
#chron .ch-mbox{width:100%;max-width:460px;max-height:90vh;overflow:auto;background:#f8f2e4;border:1px solid #cdbb92;border-radius:16px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pageIn .35s}
#chron .ch-mbox h3{font-size:24px;margin:6px 0;color:#2f3b2f} #chron .ch-mbox p{margin:0 0 12px;line-height:1.5;color:#5a4a32}
#chron .ch-opt{display:grid;grid-template-columns:30px 1fr;gap:0 8px;width:100%;text-align:left;margin:0 0 8px;padding:10px 12px;border:1px solid #cdbb92;border-radius:10px;background:#fffaf0;color:#2f3b2f;font-family:inherit}
#chron .ch-opt span{grid-row:span 2;color:#9aa88a;font-size:18px;align-self:center} #chron .ch-opt b{font-size:16px} #chron .ch-opt small{color:#7a6a52;font-size:13px}
#chron .ch-fate{width:100%;min-height:42px;border-radius:10px;border:1px dashed #a07a35;background:transparent;color:#a07a35;font-family:inherit;font-weight:700}
#flash{position:fixed;inset:0;z-index:36;background:#fff;opacity:0;pointer-events:none}
#flash.on{animation:flash .7s ease-out}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
#cd{position:fixed;left:50%;top:30%;z-index:26;transform:translate(-50%,-50%);font-family:var(--serif);font-weight:700;font-size:clamp(46px,14vw,96px);color:#fff3dc;text-shadow:0 3px 18px rgba(0,0,0,.65);pointer-events:none;opacity:0;white-space:nowrap}
#cd.on{animation:cdpop .8s ease-out}
@keyframes cdpop{0%{opacity:0;transform:translate(-50%,-50%) scale(1.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0}}
.photo-prev{display:block;max-width:100%;max-height:44vh;margin:0 auto 10px;border-radius:6px;box-shadow:0 3px 14px rgba(0,0,0,.3)}

/* Lớp trò nhịp (chuông, mõ) */
#rhythm{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:calc(62px + var(--sat)) 16px calc(26px + var(--sab));touch-action:none;cursor:pointer;
  background:linear-gradient(180deg,rgba(25,12,25,.05),rgba(25,12,25,.55) 72%)}
#rTop{position:absolute;left:0;right:0;top:calc(14px + var(--sat));text-align:center;color:#fff0d2;font-family:var(--serif);font-size:18px;padding:0 60px;pointer-events:none;text-shadow:0 1px 6px #000a}
#rProg{position:absolute;left:18%;right:18%;top:calc(46px + var(--sat));height:7px;border-radius:4px;background:rgba(255,240,210,.25);overflow:hidden;pointer-events:none}
#rProg i{display:block;height:100%;width:0;background:var(--gold)}
#rClose{position:absolute;right:calc(10px + var(--sar));top:calc(8px + var(--sat));min-width:46px;height:46px;padding:0 10px;border-radius:12px;background:rgba(40,22,30,.72);color:#ffeccb;font-size:13px;font-weight:700}
#rPad{position:relative;width:min(70vw,290px,44vh);aspect-ratio:1;flex:none;margin-bottom:14px;pointer-events:none}
#rPad .target,#rPad .ring{position:absolute;inset:0;border-radius:50%}
#rPad .target{transform:scale(.5);border:5px solid rgba(255,235,190,.85);box-shadow:0 0 20px rgba(255,210,120,.45)}
#rPad .ring{border:7px solid var(--gold);will-change:transform,opacity;opacity:0}
#rPad .core{position:absolute;left:50%;top:50%;width:38%;height:38%;margin:-19% 0 0 -19%;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff3dc;font-family:var(--serif);font-weight:700;font-size:17px;text-align:center}
#rPad .core.mo{background:radial-gradient(circle at 40% 30%,#b97a42,#6e3f1e 72%);box-shadow:0 5px 12px rgba(0,0,0,.45)}
#rPad .core.chuong{background:radial-gradient(circle at 40% 30%,#c79a4c,#6d4d1d 72%);box-shadow:0 5px 12px rgba(0,0,0,.45)}
#rPad .core.hit{animation:corehit .18s}
@keyframes corehit{50%{transform:scale(.88)}}
#rJudge{height:40px;font-family:var(--serif);font-size:28px;font-weight:700;color:#ffe9b8;text-shadow:0 1px 8px #000b;pointer-events:none;opacity:0}
#rJudge.on{animation:judge .75s ease-out}
@keyframes judge{0%{opacity:0;transform:translateY(8px)}15%{opacity:1;transform:none}70%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
#rHint{color:#ffeccb;font-size:15px;text-align:center;pointer-events:none;min-height:21px}

/* Trang hướng dẫn, Sổ cầu an, Chia sẻ */
.page{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:calc(12px + var(--sat)) 12px calc(12px + var(--sab));background:rgba(25,12,25,.6)}
.pagebox{width:min(520px,100%);max-height:100%;display:flex;flex-direction:column;border-radius:20px;background:var(--paper);overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.pagehead{display:flex;align-items:center;justify-content:space-between;padding:13px 12px 11px 18px;border-bottom:1px solid var(--line)}
.pagehead h2{margin:0;font-family:var(--serif);font-size:23px;color:var(--red2)}
.pagemain{padding:15px 16px 18px;overflow:auto;-webkit-overflow-scrolling:touch}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center}
.stat b{display:block;font-family:var(--serif);font-size:26px;color:var(--red)}
.stat span{font-size:12px;color:var(--ink2);line-height:1.25;display:block}
.pagemain h3{font-family:var(--serif);font-size:18px;margin:16px 0 8px;color:var(--ink)}
.entry{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:8px}
.entry p{margin:0 0 5px;font-family:var(--serif);font-size:16.5px;line-height:1.4;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.entry .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink2)}
.entry .meta button{color:var(--red);font-weight:700;min-height:34px;padding:0 6px}
.empty{color:var(--ink2);font-size:14.5px;line-height:1.45;padding:2px 0 6px}
.namerow{display:flex;gap:8px;margin-bottom:14px}
.namerow input{flex:1;min-width:0;height:48px;border-radius:12px;border:2px solid var(--line);padding:0 12px;font-size:17px;background:#fff;color:var(--ink)}
#tutorial .pagebox{padding:22px 20px 16px;text-align:center}
#tutorial .step{font-size:13px;color:var(--ink2);letter-spacing:.06em}
#tutorial h2{font-family:var(--serif);font-size:25px;margin:5px 0 8px;color:var(--red2)}
#tutorial p{font-size:16.5px;line-height:1.5;margin:0 0 16px;min-height:75px}
#tutorial svg{width:96px;height:96px;margin:6px auto 6px;display:block}
#sharePreview{display:block;width:auto;max-width:100%;max-height:58vh;margin:0 auto 12px;border-radius:12px;box-shadow:0 3px 14px rgba(0,0,0,.3)}
#fatal{position:fixed;inset:0;z-index:60;background:#2a1a30;color:#ffeccb;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;font-size:17px;line-height:1.5}
@media (max-height:500px){ #welcome svg.sil,#welcome .sun{display:none} #toast{bottom:calc(10px + var(--sab));max-width:42vw} }
/* Đình Lá Số: biểu mẫu ngày giờ sinh và bàn 12 cung */
.tv-field{display:flex;flex-direction:column;gap:5px;margin:0 0 10px;font-size:14px;font-weight:600;color:var(--ink)}
.tv-field input,.tv-field select{height:48px;border-radius:12px;border:2px solid var(--line);padding:0 12px;font-size:17px;background:#fff;color:var(--ink);width:100%}
.tv-check{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:var(--ink2);margin:2px 0 12px;line-height:1.4}
.tv-check input{width:20px;height:20px;flex:none;margin-top:1px}
.tv-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;margin:4px 0 12px;font-size:11px;color:var(--ink)}
.tv-cell{background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 5px 6px;min-height:92px;min-width:0;overflow-wrap:anywhere;line-height:1.25}
.tv-cell.menh{border-color:var(--red);box-shadow:0 0 0 1.5px var(--red) inset;background:#fff6ec}
.tv-pn{font-weight:700;color:var(--red2);font-size:11.5px}
.tv-cc{color:var(--ink2);font-size:10px}
.tv-ms{font-weight:700;font-size:11.5px;margin-top:3px}
.tv-br{font-weight:500;color:var(--ink2);font-size:10px}
.tv-hoa{display:inline-block;padding:0 4px;border-radius:4px;background:var(--gold);color:#3a2408;font-size:9.5px;font-weight:700;margin-left:2px}
.tv-mi{color:var(--ink2);font-size:10px;margin-top:3px}
.tv-center{grid-column:2/4;grid-row:2/4;background:linear-gradient(180deg,#fff,#fff3dc);border:1px solid var(--gold2);border-radius:10px;padding:8px;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:3px;font-size:11.5px;line-height:1.35;color:var(--ink)}
.tv-center b{font-family:var(--serif);font-size:15px;color:var(--red2)}
.tv-note{text-align:left}
.tv-note p{font-size:16.5px}
@media (prefers-reduced-motion:reduce){#action{animation:none}}
@media (min-width:820px) and (pointer:fine){ #joy{display:none} #action{bottom:calc(40px + var(--sab));right:calc(50% - 90px);min-width:180px} #toast{bottom:150px} }

/* ===== GIAO DIỆN KÍNH: lấy từ bản nâng cấp đồ hoạ của Muse, chỉ giữ phần trang trí.
   Bỏ các luật làm kẹt game: #sheet.open / #toast.show (game dùng .on), #sheet pointer-events:none, #sheetBody overflow:hidden ===== */
:root{
  --ink:#2b1d16; --ink2:#7a5f4a; --paper:#fff7e8; --paper2:#fbeccd; --line:#e7cfa3;
  --gold:#f3c15d; --gold2:#c68a28; --gold-glow:rgba(243,193,93,.45); --red:#b52e1c; --red2:#7a1e12; --red-glow:rgba(181,46,28,.35);
  --glass:rgba(255,247,232,.8); --glass-strong:rgba(255,247,232,.94); --glass-dark:rgba(34,18,28,.62); --glass-dark-strong:rgba(34,18,28,.78);
  --shadow-soft:0 10px 40px rgba(42,18,30,.18),0 2px 12px rgba(42,18,30,.12); --shadow-lift:0 18px 50px rgba(42,18,30,.24),0 4px 18px rgba(42,18,30,.16);
}
html,body{background:radial-gradient(120% 120% at 50% 10%,#4a2d5a 0%,#2a1a30 55%,#1a0f1c 100%)}
#stage{filter:saturate(1.05) contrast(1.02)}
.btn{border:1px solid rgba(231,207,163,.65);box-shadow:var(--shadow-soft),inset 0 1px 0 rgba(255,255,255,.7);transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s,filter .2s}
.btn.main{background:linear-gradient(180deg,#d44a33 0%,#a82a1a 100%);color:#fff6e0;border-color:transparent;box-shadow:0 4px 0 var(--red2),0 12px 28px var(--red-glow),inset 0 1px 0 rgba(255,255,255,.35);text-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn.ghost{border-color:transparent;box-shadow:none}
/* Màn chào: nền hoàng hôn chuyển động, khung nhập bằng kính sáng */
#welcome{background:radial-gradient(120% 80% at 50% 15%,#ffe7a8 0%,#ffb56a 18%,#e96d4a 34%,#8a3d6a 52%,#3a2245 68%,#221425 85%)}
#welcome::before{content:'';position:absolute;inset:-20%;background:radial-gradient(40% 40% at 30% 20%,rgba(255,255,255,.18) 0%,transparent 60%),radial-gradient(50% 50% at 80% 30%,rgba(255,180,100,.22) 0%,transparent 60%),radial-gradient(60% 60% at 50% 80%,rgba(90,40,80,.5) 0%,transparent 70%);animation:drift 18s ease-in-out infinite alternate;pointer-events:none}
@keyframes drift{0%{transform:translate3d(-2%,-1%,0) scale(1)}100%{transform:translate3d(2%,1.5%,0) scale(1.05)}}
#welcome svg.sil{filter:drop-shadow(0 12px 24px rgba(0,0,0,.4))}
#welcome .sun{box-shadow:0 0 80px rgba(255,200,100,.55),0 0 140px rgba(255,140,60,.25);animation:sunPulse 4s ease-in-out infinite}
@keyframes sunPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.wbox{z-index:1}
.wbox h1{text-shadow:0 2px 0 rgba(0,0,0,.15),0 8px 32px rgba(40,10,40,.6),0 0 40px rgba(255,220,160,.25)}
.wform{padding:18px 16px 16px;background:var(--glass);border:1px solid rgba(255,236,203,.7);border-radius:24px;backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);box-shadow:var(--shadow-lift),inset 0 1px 0 rgba(255,255,255,.8)}
.wbox label{color:var(--ink2);font-weight:700}
.wbox input{border:1.5px solid var(--line);background:rgba(255,255,255,.9);box-shadow:inset 0 2px 8px rgba(90,60,20,.06)}
#wstatus{color:var(--ink2);font-weight:600} .wnote{color:#8a6d52}
.wform .hc{background:rgba(90,50,20,.08);color:var(--ink)} .wform .hc.sel{background:linear-gradient(180deg,#fff8e6,#f6e6cb);border-color:var(--gold)}
.wform .lname{color:var(--ink2);font-weight:600} .wform .fam,.wbox .wform label.fam{color:var(--ink)}
.sw{border-color:rgba(255,240,210,.8);box-shadow:0 2px 8px rgba(0,0,0,.12),inset 0 1px 2px rgba(255,255,255,.6);transition:transform .2s}
.sw.sel{border-color:#fff;box-shadow:0 0 0 3px var(--red),0 6px 16px rgba(165,48,31,.35);transform:scale(1.1)}
/* Bảng điều khiển trên cảnh: kính tối */
#counter,.tool,#moodBtn,#mapBtn,#rClose{background:var(--glass-dark);border:1px solid rgba(255,236,203,.14);backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);box-shadow:0 8px 24px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.1)}
#counter{border-radius:16px} #counter b{text-shadow:0 0 12px var(--gold-glow)}
.tool{border-radius:14px}
#moodBtn.on{background:var(--glass-strong);color:var(--ink)}
#joy{background:radial-gradient(100% 100% at 35% 30%,rgba(255,247,232,.22) 0%,rgba(255,247,232,.08) 55%,rgba(40,22,30,.18) 100%);border:1.5px solid rgba(255,240,210,.28);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 12px 32px rgba(0,0,0,.22),inset 0 -8px 20px rgba(0,0,0,.18)}
#knob{background:radial-gradient(100% 100% at 35% 25%,#fff7e8 0%,#f6e6cb 45%,#e3cda8 100%);box-shadow:0 4px 12px rgba(0,0,0,.2),inset 0 1px 1px #fff}
#action{background:linear-gradient(180deg,#d8503a,#a82a1a);border:1px solid rgba(255,255,255,.25)}
#toast,#caption{background:var(--glass-strong);color:var(--ink);border:1px solid rgba(231,207,163,.7);box-shadow:var(--shadow-lift),inset 0 1px 0 #fff;backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4)}
.bub{border:1px solid rgba(231,207,163,.6);box-shadow:0 6px 18px rgba(0,0,0,.22)}
/* Bảng trượt và các trang */
#sheetBody{background:var(--glass-strong);border:1px solid rgba(231,207,163,.7);border-bottom:0;border-radius:24px 24px 0 0;box-shadow:0 -12px 40px rgba(42,18,30,.18),var(--shadow-lift),inset 0 1px 0 #fff;backdrop-filter:blur(28px) saturate(1.6);-webkit-backdrop-filter:blur(28px) saturate(1.6)}
.page{background:rgba(26,15,28,.42);backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(12px) saturate(1.2)}
.pagebox{background:var(--glass-strong);border:1px solid rgba(231,207,163,.7);border-radius:24px;backdrop-filter:blur(28px) saturate(1.6);-webkit-backdrop-filter:blur(28px) saturate(1.6);animation:pageIn .45s cubic-bezier(.32,.72,0,1)}
@keyframes pageIn{from{transform:translateY(24px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.pagehead{border-bottom:1.5px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,247,232,.3))}
.stat{background:linear-gradient(180deg,#fff,#fff6e5);border:1.5px solid var(--line);border-radius:18px;box-shadow:0 4px 16px rgba(90,50,20,.06),inset 0 1px 0 #fff}
.entry{background:linear-gradient(180deg,#fff,#fff8eb);border:1.5px solid var(--line);border-radius:16px;box-shadow:0 3px 12px rgba(90,50,20,.05),inset 0 1px 0 #fff}
.choice button{box-shadow:0 4px 14px rgba(90,50,20,.08),inset 0 1px 0 #fff}
.card{box-shadow:0 8px 28px rgba(90,50,20,.12),inset 0 1px 0 #fff}
#sharePreview{border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.28);border:2px solid #fff}
#fatal{background:radial-gradient(100% 100% at 50% 20%,#4a2d5a,#1a0f1c)}
/* Hiệu ứng phủ màn: viền tối, vệt nắng, hạt phim (không chặn chạm) */
#fx-vignette{position:fixed;inset:0;pointer-events:none;z-index:9;background:radial-gradient(120% 120% at 50% 50%,transparent 62%,rgba(26,15,28,.22) 86%,rgba(26,15,28,.55) 100%)}
#fx-grain{position:fixed;inset:-50%;pointer-events:none;z-index:9;opacity:.035;will-change:transform;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");animation:grainShift 8s steps(10) infinite}@media (pointer:coarse){#fx-grain{display:none}}
@keyframes grainShift{0%,100%{transform:translate(0,0)}20%{transform:translate(-10%,5%)}40%{transform:translate(-5%,15%)}60%{transform:translate(15%,0)}80%{transform:translate(3%,-15%)}}
#fx-lightleak{position:fixed;left:0;top:0;width:60%;height:100%;pointer-events:none;z-index:8;opacity:.12;background:radial-gradient(80% 60% at 10% 20%,rgba(255,180,90,.5) 0%,transparent 70%);mix-blend-mode:soft-light;animation:leak 12s ease-in-out infinite alternate}
@keyframes leak{0%{opacity:.08;transform:translateX(-2%)}100%{opacity:.16;transform:translateX(2%)}}
@media (prefers-reduced-motion:reduce){#welcome::before,#welcome .sun,#fx-grain,#fx-lightleak{animation:none}}
</style>

</head>
<body>
<div id="fx-vignette"></div><div id="fx-lightleak"></div><div id="fx-grain"></div><div id="stage" aria-label="Khung cảnh chùa An Lạc"></div>

<!-- Màn chào: chỉ HTML/CSS nên hiện ngay, trước khi tải Three.js -->
<section id="welcome">

  <div class="wbox">

    </div>
  </div>
</section>

<div id="hud" class="hide">
  <div id="counter">Hôm nay có <b id="countNum">…</b> người lên chùa cầu an<div id="clockLine"></div><div id="netLine" class="hide"></div></div>
  <div id="xkHud"></div>
  <div id="tools">
    <button class="tool" id="muteBtn" aria-label="Tắt tiếng"></button>
    <button class="tool" id="musicBtn" aria-label="Tắt nhạc thiền"></button>
    <button class="tool" id="bookBtn" aria-label="Mở Sổ cầu an của tôi">Sổ</button>
    <button class="tool" id="shareBtn" aria-label="Chia sẻ ảnh">Chia sẻ</button>

const BAD_WORDS = new Set(['đụ', 'địt', 'đéo', 'đĩ', 'lồn', 'cặc', 'buồi', 'dái', 'đm', 'dm', 'đmm', 'dmm', 'đcm', 'dcm', 'clm', 'cmm', 'vcl', 'vkl', 'vãi lồn', 'vl', 'cc', 'đcmm', 'ditme', 'địt mẹ', 'đụ má', 'đụ mẹ', 'mẹ kiếp', 'chó đẻ', 'óc chó', 'con đĩ', 'fuck', 'fucking', 'shit', 'bitch', 'asshole', 'dick', 'pussy']);
function hasBadWord(text) {
  const clean = (text || '').normalize('NFC').toLowerCase();
  const tok = clean.split(/[^\p{L}\p{N}]+/u).filter(Boolean);
  for (let i = 0; i < tok.length; i++) {
    if (BAD_WORDS.has(tok[i])) return true;
    if (i + 1 < tok.length && BAD_WORDS.has(tok[i] + ' ' + tok[i + 1])) return true;
    if (tok[i].length === 1) { // chữ cách nhau: "đ m", "v c l"
      let j = i, s = '';
      while (j < tok.length && tok[j].length === 1) s += tok[j++];
      if (BAD_WORDS.has(s)) return true;
    }
  }
  return false;
}

    let word = w;
    while (c.measureText(word).width > maxW && word.length > 1) { // từ quá dài: cắt theo ký tự
      let n = word.length; while (n > 1 && c.measureText(word.slice(0, n)).width > maxW) n--;

    const t = line ? line + ' ' + word : word;
    if (c.measureText(t).width > maxW && line) { out.push(line); line = word; } else line = t;
  }
  if (line) out.push(line);
  return out;
}

const CAM_DIST = 8.6;

  const f = Cam.focus, P = Player;

  let cx = Cam.tx + hx * d, cyy = Cam.ty + hy * d, cz = Cam.tz + hz * d;
  // Trong điện thì giữ máy quay dưới trần và dưới mép mái
  if (Cam.tz < -8.5 && Cam.tz > -28 && Math.abs(Cam.tx) < 19) cyy = Math.min(cyy, 5.25); else if (cz < -7.6 && cz > -29 && Math.abs(cx) < 20 && cyy > 5.3 && cyy < 11) cyy = 5.3;
  if (Math.abs(Cam.tx - DINH.x) < DINH.w && Math.abs(Cam.tz - DINH.z) < DINH.d) cyy = Math.min(cyy, 4.1);

  camera.lookAt(Cam.tx, Cam.ty, Cam.tz);
}

/* ===== ĐIỀU KHIỂN: cần ảo, phím, kéo màn để xoay góc nhìn ===== */
function bindInput() {
  const cv = renderer.domElement, joy = $('#joy'), knob = $('#knob');
  let joyCx = 0, joyCy = 0, joyR = 0;
  const updateJoyRect = () => { const r = joy.getBoundingClientRect(); joyR = r.width / 2; joyCx = r.left + joyR; joyCy = r.top + joyR; };
  const setJoy = (e) => {
    const dx = e.clientX - joyCx, dy = e.clientY - joyCy, d = Math.hypot(dx, dy), maxD = joyR * .8, k = d > maxD ? maxD / d : 1;
    const x = dx * k, y = dy * k; knob.style.transform = `translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,0)`;
    Input.jx = x / maxD; Input.jy = y / maxD;
    if (Math.hypot(Input.jx, Input.jy) < .12) Input.jx = Input.jy = 0;
  };
  const endJoy = () => { Input.joyId = null; Input.jx = Input.jy = 0; knob.style.transform = ''; };
  joy.addEventListener('pointerdown', e => { e.preventDefault(); Input.joyId = e.pointerId; updateJoyRect(); joy.setPointerCapture(e.pointerId); setJoy(e); });
  joy.addEventListener('pointermove', e => { if (e.pointerId === Input.joyId) setJoy(e); }, { passive: true });
  joy.addEventListener('pointerup', e => { if (e.pointerId === Input.joyId) endJoy(); });
  joy.addEventListener('pointercancel', e => { if (e.pointerId === Input.joyId) endJoy(); });
  cv.addEventListener('pointerdown', e => {
    if (Game.busy || Input.lookId !== null) return;
    Input.lookId = e.pointerId; Input.lastX = e.clientX; Input.lastY = e.clientY; cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove', e => {
    if (e.pointerId !== Input.lookId) return;
    const dx = e.clientX - Input.lastX, dy = e.clientY - Input.lastY; Input.lastX = e.clientX; Input.lastY = e.clientY;
    Cam.yaw -= dx * .0068; Cam.pitchUser = clamp(Cam.pitchUser + dy * .0042, .06, 1.0); Input.lastLook = Game.t;
  });
  const endLook = e => { if (e.pointerId === Input.lookId) Input.lookId = null; };
  cv.addEventListener('pointerup', endLook); cv.addEventListener('pointercancel', endLook);
  cv.addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('keydown', e => {
    const tag = e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (tag !== 'BUTTON' && ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
    Input.keys[e.code] = true;
    if (e.repeat) return;
    if ((e.code === 'Space' || e.code === 'KeyE' || e.code === 'Enter') && Game.started) {
      if (Rhythm.active) { Rhythm.tap(); return; }

}

async function xkShout(c) {
  const P = Player; beginActivity(); const id = Game.actId;
  P.pose = c.dance ? 'cheer' : 'point'; caption(`“${c.shout}”`, 2600); say(PSAY, c.shout); Snd.beep(660, .12, .18); setTimeout(() => Snd.beep(880, .12, .2), 160);
  focusOn(P.x, 1, P.z, P.ry + Math.PI + .5, .55, 11);
  // Chọn người gần nhất mỗi loại, tối đa 8 người
  let ppl = Palace.npcs.filter(n => c.who.includes(n.kind) && n.C.group.visible);
  ppl.sort((a, b) => Math.hypot(a.x - P.x, a.z - P.z) - Math.hypot(b.x - P.x, b.z - P.z)); ppl = ppl.slice(0, 8);
  if (!ppl.length) { await wait(1500); toast('Không ai nghe thấy… hình như mọi người đi ăn chè cả rồi.', 3000); endActivity(); return; }
  const N = ppl.length;
  ppl.forEach((n, i) => {
    let a, r = 2.2 + (i % 2) * .7;
    if (c.line) { a = 0; } else a = P.ry + (N === 1 ? 0 : (i / (N - 1) - .5) * (c.face === 'out' ? 6.28 * (N - 1) / N : 2.6));
    let tx = P.x + Math.sin(a) * r, tz = P.z + Math.cos(a) * r;
    if (c.line) { tx = P.x + Math.sin(P.ry) * 2.6 + Math.cos(P.ry) * (i - (N - 1) / 2) * 1.1; tz = P.z + Math.cos(P.ry) * 2.6 - Math.sin(P.ry) * (i - (N - 1) / 2) * 1.1; }
    const o = Col.resolve(tx, tz, .35);
    n.summon = { x: o.x, z: o.z, t: 0, arrived: false, cmd: c, i }; n.busy = true;
  });
  // Chờ mọi người chạy tới (tối đa 7 giây), rồi ai cũng đáp lời
  for (let k = 0; k < 28 && ppl.some(n => !n.summon?.arrived); k++) { await wait(250); if (id !== Game.actId) return; }
  ppl.forEach((n, i) => { if (!n.summon.arrived) { n.x = n.summon.x; n.z = n.summon.z; n.summon.arrived = true; } setTimeout(() => say(n, pick(c.say)), i * 260); });
  if (c.dance) { P.pose = 'cheer'; Snd.chime(.25); }
  await wait(2600); if (id !== Game.actId) return;
  const extra = c.after ? XK_AFTER[c.after]() : '';
  if (c.fav || c.fame) xkAdd(c.fav || 0, c.fame || 0);
  P.pose = 'idle';
  openSheet(`<h2 class="sheet-title">${c.n.replace(/^\S+\s/, '')}</h2><p class="sheet-sub">${ppl.length} ${[...new Set(ppl.map(n => XK_KIND_NAME[n.kind]))].join(', ')} chạy tới ngay lập tức.${extra ? '<br><br>' + extra : ''}</p><button class="btn main wide" id="doneBtn">Cho lui</button>`);
  $('#doneBtn').onclick = () => { xkDismiss(); endActivity(); };
}

function moveSummoned(n, dt, P) {
  const s = n.summon;

    if (!s.arrived) {
      const dx = s.x - n.x, dz = s.z - n.z, d = Math.hypot(dx, dz); s.t += dt;
      if (d < .2 || s.t > 9) { s.arrived = true; n.pose = s.cmd.pose; }
      else { const sp = 4.6, o = Col.resolve(n.x + dx / d * sp * dt, n.z + dz / d * sp * dt, .32); n.x = o.x; n.z = o.z; n.ry = dampAngle(n.ry, Math.atan2(dx, dz), 10, dt); n.C.walkT += sp * dt * 2.6; n.pose = 'idle'; n.y = groundY(n.x, n.z); return sp; }
    }
    const f = s.cmd.face, fa = f === 'out' ? Math.atan2(n.x - P.x, n.z - P.z) : f === 'hall' ? Math.PI : Math.atan2(P.x - n.x, P.z - n.z);
    n.ry = dampAngle(n.ry, fa, 6, dt); if (s.cmd.dance) n.pose = Math.sin(Game.t * 3 + s.i) > 0 ? 'cheer' : 'idle';
    return 0;
  }
  if (n.ret) {
    const dx = n.hx - n.x, dz = n.hz - n.z, d = Math.hypot(dx, dz);
    if (d < .2) { n.ret = false; n.x = n.hx; n.z = n.hz; n.y = n.hy; n.pose = n.hpose; n.ry = n.home; return 0; }
    const sp = 2.2, o = Col.resolve(n.x + dx / d * sp * dt, n.z + dz / d * sp * dt, .32); n.x = o.x; n.z = o.z; n.ry = dampAngle(n.ry, Math.atan2(dx, dz), 8, dt); n.C.walkT += sp * dt * 2.6; n.pose = 'idle'; n.y = groundY(n.x, n.z);
    if ((n.rt = (n.rt || 0) + dt) > 20) { n.x = n.hx; n.z = n.hz; } return sp;
  }
  return -1;
}

const HairBits = { list: [] };
function spawnHair(n) {
  if (!Player.chibi) return;
  if (!World.hairGeo) { World.hairGeo = new THREE.BoxGeometry(.08, .022, .11); World.hairMat = new THREE.MeshLambertMaterial({ color: '#2a1d17' }); }
  const v = new THREE.Vector3(); Player.chibi.head.getWorldPosition(v);

    const m = new THREE.Mesh(World.hairGeo, World.hairMat); m.position.set(v.x + rand(-.28, .28), v.y + rand(.3, .55), v.z + rand(-.28, .28)); m.rotation.set(rand(0, 6), rand(0, 6), rand(0, 6)); scene.add(m);
    HairBits.list.push({ m, vx: rand(-.6, .6), vy: rand(0, .8), vz: rand(-.6, .6), spin: rand(-7, 7), life: rand(7, 10), ground: groundY(m.position.x, m.position.z) + .015 });
  }
}
function updateHairBits(dt) {
  const L = HairBits.list;
  for (let i = L.length - 1; i >= 0; i--) {
    const h = L[i], p = h.m.position; h.life -= dt;
    if (p.y > h.ground) { // rơi lả tả, sức cản không khí lớn
      h.vy = Math.max(h.vy - 4 * dt, -1.4); h.vx *= 1 - 1.5 * dt; h.vz *= 1 - 1.5 * dt;
      p.x += h.vx * dt; p.z += h.vz * dt; p.y = Math.max(h.ground, p.y + h.vy * dt);
      h.m.rotation.x += h.spin * dt; h.m.rotation.z += h.spin * .4 * dt;
      if (p.y === h.ground) { h.m.rotation.x = 0; h.m.rotation.z = 0; }
    }
    if (h.life < 1) h.m.scale.setScalar(Math.max(.01, h.life));
    if (h.life <= 0) { scene.remove(h.m); L.splice(i, 1); }
  }
}

/* ===== TÂM TRẠNG: gõ vài chữ, hiện bong bóng trên đầu nhân vật; xoá chữ đi là tắt. Người cùng vào qua link cũng thấy ===== */
const MOOD_MAX = 40;
const MOOD_IDEAS = ['😊 Bình an', '🙏 Biết ơn', '🌸 Vui vẻ', '😌 Thảnh thơi', '🍀 Mong may mắn', '😴 Hơi mệt'];

function moodSprite(text) {
  const tex = canvasTex(640, 150, (c, w, h) => {
    const font = n => `600 ${n}px -apple-system,"Segoe UI",Roboto,Arial,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    let size = 46; c.font = font(size); while (c.measureText(text).width > w - 70 && size > 22) { size -= 2; c.font = font(size); }
    const tw = Math.min(w - 16, c.measureText(text).width + 56), x0 = (w - tw) / 2, bh = h - 42, cx = w / 2;
    c.fillStyle = 'rgba(255,248,232,.97)'; c.strokeStyle = '#e9b44c'; c.lineWidth = 4;
    c.beginPath(); c.roundRect(x0, 6, tw, bh, 30); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(cx - 16, 6 + bh - 2); c.lineTo(cx, h - 8); c.lineTo(cx + 16, 6 + bh - 2); c.closePath(); c.fill(); // đuôi bong bóng
    c.beginPath(); c.moveTo(cx - 16, 6 + bh); c.lineTo(cx, h - 8); c.lineTo(cx + 16, 6 + bh); c.stroke();
    c.fillRect(cx - 14, 6 + bh - 5, 28, 7);

  });
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, fog: false }));
  sp.scale.set(2.6, .61, 1); sp.renderOrder = 5; return sp;

      Rhythm.hitCore(); BELL.pull = 0; World.striker.rotation.z = -.03; Rhythm.setRing(.5, 0); Player.strikeA = -.2;
      if (diff < .065) { perfect++; Rhythm.judge('Tròn tiếng'); Snd.bell(.95, 13); Cam.shake = 1; BELL.swingV = .32; vibrate([40, 30, 40]); }
      else if (diff < .17) { Rhythm.judge('Ngân vừa'); Snd.bell(.6, 8); Cam.shake = .45; BELL.swingV = .18; vibrate(25); }
      else { Rhythm.judge('Khẽ thôi'); Snd.bell(.3, 4.5); BELL.swingV = .08; }
      if (diff < .17) bellHeard(); left--; phase = 'rest'; pause = left ? 2.1 : 3.4; Net.bell++;
    },
    onUpdate(dt) {
      if (phase === 'pull') {
        p += dt / DUR;
        if (p >= 1) p = 0;
        Rhythm.setRing(lerp(1, .26, p), clamp(p * 6, 0, 1)); World.striker.rotation.z = BELL.pull = p * .5; Player.strikeA = .1 + p * .25;
      } else {
        pause -= dt; World.striker.rotation.z = damp(World.striker.rotation.z, 0, 4, dt);
        if (pause <= 0) {
          if (left > 0) { phase = 'pull'; p = 0; $('#rTop').textContent = `Tiếng thứ ${4 - left} trong 3`; }
          else { phase = 'done'; Rhythm.stop(); finishBell(perfect); }
        }
      }
    },
  });
  Game.update = dt => Rhythm.onUpdate?.(dt);
}
function finishBell(perfect) {
  Game.update = null;
  const msg = perfect === 3 ? 'Cả ba tiếng đều tròn. Tiếng chuông ngân xa, lắng dần vào chiều.' : perfect > 0 ? 'Tiếng chuông ngân qua mái chùa, lắng dần vào không gian.' : 'Tiếng chuông nhẹ nhàng cũng đủ làm lòng lắng lại.';
  openSheet(`<h2 class="sheet-title">Chuông đã ngân</h2><p class="praise">${msg}</p>${resultButtons('againBtn', 'Thỉnh lần nữa')}`);
  $('#doneBtn').onclick = endActivity; $('#againBtn').onclick = () => { endActivity(); actBell(); };
}
function updateBellVisual(dt, t) {
  BELL.swingV *= Math.exp(-dt * .7); BELL.swing += dt;
  World.bell.rotation.z = Math.sin(BELL.swing * 5.1) * BELL.swingV * .25;
  World.bell.rotation.x = Math.sin(BELL.swing * 3.7) * BELL.swingV * .12;
}

/* ===== HOẠT ĐỘNG 3: GÕ MÕ TỤNG KINH – 30 giây theo vòng nhịp, chấm Tĩnh tâm / Được / Lệch nhịp ===== */
const MO_BEATS = 25, MO_GAP = 1.2;
const CHANT_LINES = ['Nam mô A Di Đà Phật', 'Nam mô Bổn Sư Thích Ca Mâu Ni Phật', 'Nam mô Quan Thế Âm Bồ Tát', 'Thở vào, tâm an', 'Thở ra, mỉm cười'];
async function actMo() {
  beginActivity();
  await walkTo(9.5, -15.25, 2.4);
  faceTo(9.5, -17); Player.pose = 'sit'; Game.sitting = true; Player.leanT = .04;
  focusOn(9.5, .95, -16.2, .62, .22, 6);
  Snd.chantFocus(true);
  const st = { i: 0, clock: -2.4, judged: new Array(MO_BEATS).fill(0), good: 0, ok: 0, off: 0, done: false, line: -1, tick: 0 };
  const beatAt = i => i * MO_GAP;
  const mark = (i, kind) => { st.judged[i] = kind; };
  const hitVisual = () => { Rhythm.hitCore(); World.mallet.rotation.x = -.55; Player.strikeA = .55; };
  Rhythm.start({
    top: 'Hít thở nhẹ…', coreText: 'Mõ', coreClass: 'mo', hint: 'Chạm khi vòng vàng khớp vòng sáng giữa', progress: true,
    onTap() {
      Snd.mo(.8); hitVisual();
      const now = st.clock + .03; // bù trễ cảm ứng
      let best = -1, bd = 1e9;
      for (let i = Math.max(0, st.i - 1); i < Math.min(MO_BEATS, st.i + 2); i++) if (!st.judged[i]) { const d = Math.abs(now - beatAt(i)); if (d < bd) { bd = d; best = i; } }
      if (best < 0 || bd > MO_GAP * .46) return; // chạm lạc giữa hai nhịp thì chỉ nghe tiếng mõ
      if (bd < .11) { mark(best, 1); st.good++; Rhythm.judge('Tĩnh tâm'); vibrate(15); }
      else if (bd < .27) { mark(best, 2); st.ok++; Rhythm.judge('Được'); }
      else { mark(best, 3); st.off++; Rhythm.judge('Lệch nhịp'); }
    },
  });
  Rhythm.setRing(1, 0);
  $('#rClose').onclick = () => { Snd.chantFocus(false); endActivity(); };
  Game.update = dt => {
    st.clock += dt; const c = st.clock;
    World.mallet.rotation.x = damp(World.mallet.rotation.x, 0, 12, dt); Player.strikeA = damp(Player.strikeA, 0, 10, dt);
    if (c < 0) { $('#rTop').textContent = c < -1.6 ? 'Hít thở nhẹ…' : c < -.8 ? 'Sẵn sàng…' : 'Theo vòng nhịp nhé'; }
    // Chuyển nhịp đã trôi qua, không chạm thì tính nhẹ là lệch
    while (st.i < MO_BEATS && c > beatAt(st.i) + MO_GAP * .46) {
      if (!st.judged[st.i]) { mark(st.i, 3); st.off++; Rhythm.judge('Lệch nhịp'); }
      st.i++;
    }
    if (st.i >= MO_BEATS) { if (!st.done) { st.done = true; finishMo(st); } return; }
    // Vòng co về nhịp kế tiếp
    const next = beatAt(st.i), ph = clamp(1 - (next - c) / MO_GAP, 0, 1.2);
    const scale = ph <= 1 ? lerp(1, .5, ph) : lerp(.5, .38, (ph - 1) / .2), op = ph < .1 ? ph * 10 : ph > 1 ? 1 - (ph - 1) * 5 : 1;
    Rhythm.setRing(scale, st.judged[st.i] ? .25 : op);
    if (c >= 0) {
      $('#rProg i').style.width = (clamp(c / (MO_BEATS * MO_GAP), 0, 1) * 100).toFixed(1) + '%';
      const line = Math.floor(c / 6) % CHANT_LINES.length; if (line !== st.line) { st.line = line; $('#rTop').textContent = CHANT_LINES[line]; }
    }
    if (st.tick < MO_BEATS && c >= beatAt(st.tick)) { st.tick++; if (Snd.ctx) Snd.tock(Snd.ctx.currentTime + .001, .1); } // nhịp dẫn rất khẽ
  };
}
function moPraise(s) {
  if (s >= 90) return 'Tiếng mõ đều như hơi thở. Lòng bạn thật an.';
  if (s >= 70) return 'Nhịp mõ nhẹ và đều, lòng cũng dịu lại.';
  if (s >= 40) return 'Có lúc nhanh, lúc chậm, như một ngày bình thường. Bạn đã ngồi lại, thế là đẹp rồi.';
  return 'Không cần vội. Ngồi xuống và thở đều cũng đã là một khoảng lặng dễ chịu.';
}
function finishMo(st) {
  Game.update = null; Rhythm.stop(); Snd.chantFocus(false);
  const score = Math.round((st.good + st.ok * .72 + st.off * .15) / MO_BEATS * 100);
  const isBest = score > Store.data.best; if (isBest) { Store.data.best = score; Store.save(); }
  Snd.chime(.14);
  openSheet(`<h2 class="sheet-title">Tâm an</h2><div class="score">${score}<small> / 100</small></div>
    <div class="tally"><span>Tĩnh tâm: <b>${st.good}</b></span><span>Được: <b>${st.ok}</b></span><span>Lệch nhịp: <b>${st.off}</b></span></div>
    <p class="praise">${moPraise(score)}</p>
    <p class="small" style="text-align:center;margin:-6px 0 12px">${isBest ? 'Điểm Tâm an cao nhất của bạn đã được ghi vào Sổ.' : `Điểm cao nhất của bạn: ${Store.data.best}.`} Điểm chỉ để vui, không so với ai.</p>
    ${resultButtons('shareNow', 'Chia sẻ')}`);
  finishWith(Store.data.prayers[0]);
}

/* ===== HOẠT ĐỘNG 4: VIẾT LỜI CẦU AN – treo dải lụa lên cây bồ đề hoặc thả đèn hoa đăng xuống hồ sen ===== */
const PRAYER_IDEAS = [['Gia đình', 'Cầu cho gia đình bình an, sum họp.'], ['Sức khoẻ', 'Mong người thân luôn mạnh khoẻ.'], ['Thi cử', 'Mong kỳ thi tới bình tĩnh, làm bài thật tốt.'], ['Bình an', 'Mong một năm an lành, lòng nhẹ nhàng.']];
function actPrayer(kind) {

      <button id="kLantern" class="${kind === 'lantern' ? 'sel' : ''}">Đèn hoa đăng<small>Thả xuống hồ sen</small></button>
    </div>
    <div class="row"><button class="btn" id="cancelBtn">Để sau</button><button class="btn main" id="prayerGo">Gửi lời cầu</button></div>`);

  $('#kRibbon').onclick = () => { k = 'ribbon'; $('#kRibbon').classList.add('sel'); $('#kLantern').classList.remove('sel'); };

    if (hasBadWord(text)) { warn.textContent = 'Lời cầu có từ chưa phù hợp nơi cửa chùa. Bạn viết lại nhẹ nhàng hơn nhé.'; warn.classList.remove('hide'); ta.focus(); return; }
    ta.blur(); sendPrayer(text, k);
  };
}
async function sendPrayer(text, kind) {

/* ===== HOẠT ĐỘNG 5: XIN QUẺ (giải trí) – lắc máy hoặc chạm giữ, 40 câu chúc nhẹ nhàng ===== */
const FORTUNES = [
  'Mong ngày của bạn có một niềm vui nhỏ đến đúng lúc.', 'Chậm lại một chút, bạn sẽ thấy nhiều điều đẹp đang ở quanh mình.', 'Mong bữa cơm nhà luôn có tiếng cười.', 'Một lời hỏi thăm hôm nay có thể làm ấm lòng ai đó, và cả bạn nữa.',

  'Điều tốt lành thường bắt đầu từ một việc rất nhỏ.', 'Mong lòng bạn rộng như sân chùa, mát như bóng bồ đề.', 'Bạn đã đi được một chặng dài rồi, hãy tự khen mình một câu.', 'Mong những người đi xa của bạn luôn được bình yên.',
  'Hôm nay là ngày đẹp để bắt đầu lại một thói quen tốt.', 'Mong bạn luôn có một người bạn để sẻ chia khi cần.', 'Nói nhẹ một lời, lòng nhẹ một phần.', 'Mong mỗi sáng thức dậy bạn đều có điều để mong chờ.',
  'Một chén trà, một phút lặng cũng đủ làm ngày dịu lại.', 'Mong sự kiên nhẫn của bạn đơm hoa theo cách thật riêng.', 'Tha thứ cho mình một chút, bạn sẽ đi được xa hơn.', 'Mong con trẻ trong nhà luôn hồn nhiên và ngoan hiền.',
  'Mong ông bà, cha mẹ có nhiều buổi chiều thảnh thơi.', 'Làm điều tử tế không cần ai biết, lòng bạn tự biết là đủ.', 'Mong bạn tìm thấy sự bình tĩnh ngay giữa những ngày bận rộn.', 'Hoa sen nở từ bùn, mọi khởi đầu đều có thể rất đẹp.',
  'Mong bạn có một chuyến đi vui cùng những người thân yêu.', 'Lắng nghe thêm một chút, bạn sẽ hiểu người thân hơn nhiều.', 'Mong công việc của bạn thêm thuận hoà, đồng nghiệp thêm vui vẻ.', 'Hôm nay hãy dành cho mình một bữa ăn ngon và thong thả.',
  'Mong tâm bạn trong như mặt hồ sau cơn mưa.', 'Điều bạn gieo hôm nay bằng sự chân thành sẽ là kỷ niệm đẹp mai sau.', 'Mong bạn luôn nhớ rằng mình được yêu thương nhiều hơn mình nghĩ.', 'Năm mới, mong bạn thêm một chút vui và bớt một chút lo.',
];
function actFortune() {
  // Xin quyền cảm biến ngay trong lần chạm (iOS yêu cầu)
  let motionOK = false; const DM = window.DeviceMotionEvent;
  const st = { p: 0, holding: false, last: null, clickT: 0, done: false, shakeT: 0 };
  const onMotion = e => {
    const a = e.accelerationIncludingGravity; if (!a || a.x == null) return;
    const m = Math.hypot(a.x, a.y, a.z);
    if (st.last !== null && Math.abs(m - st.last) > 7) { st.p += .1; st.shakeT = .35; }
    st.last = m;
  };
  const addMotion = () => { motionOK = true; addEventListener('devicemotion', onMotion); };
  const stopMotion = () => removeEventListener('devicemotion', onMotion);
  if (DM && typeof DM.requestPermission === 'function') DM.requestPermission().then(r => { if (r === 'granted') addMotion(); }).catch(() => {});
  else if (DM && matchMedia('(pointer:coarse)').matches) addMotion();
  beginActivity();
  faceTo(-9.5, -17);
  const startQue = () => {
    openSheet(`<h2 class="sheet-title">Xin quẻ đầu năm</h2>
      <p class="sheet-sub">Lắc nhẹ điện thoại, hoặc chạm giữ nút bên dưới cho đến khi một thẻ rơi ra.</p>
      <div id="tube"><div class="sticks"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="body">Xin quẻ</div><div id="drop"></div></div>
      <div class="bar"><i id="queBar"></i></div>
      <button class="btn main wide" id="holdBtn">Chạm giữ để lắc</button>
      <button class="btn ghost wide" id="cancelBtn" style="margin-top:6px">Để sau</button>
      <p class="small" style="text-align:center;margin:8px 0 0">Mang tính giải trí</p>`);
    const hold = $('#holdBtn'), tube = $('#tube');
    st.p = 0; st.done = false;
    hold.addEventListener('pointerdown', e => { e.preventDefault(); st.holding = true; try { hold.setPointerCapture(e.pointerId); } catch (x) { /* bỏ qua */ } });
    hold.addEventListener('pointerup', () => { st.holding = false; }); hold.addEventListener('pointercancel', () => { st.holding = false; });
    hold.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); st.holding = true; } });
    hold.addEventListener('keyup', () => { st.holding = false; });
    hold.addEventListener('contextmenu', e => e.preventDefault());
    $('#cancelBtn').onclick = () => { stopMotion(); endActivity(); };
    Game.update = dt => {
      if (st.done) return;
      if (st.holding) st.p += dt / 1.7;
      st.shakeT -= dt;
      const shaking = st.holding || st.shakeT > 0;
      tube.classList.toggle('shake', shaking);
      if (shaking) { st.clickT -= dt; if (st.clickT <= 0) { st.clickT = rand(.05, .13); Snd.click(.2, 1700); } }
      $('#queBar').style.width = (clamp(st.p, 0, 1) * 100).toFixed(0) + '%';
      if (st.p >= 1) { st.done = true; st.holding = false; tube.classList.remove('shake'); revealFortune(); }
    };
  };
  const revealFortune = async () => {
    stopMotion(); Snd.click(.32, 900); $('#drop').classList.add('go');
    await wait(950);
    const recent = Store.data.fortunes.slice(0, 8).map(f => f.no);
    let no; do { no = 1 + Math.random() * FORTUNES.length | 0; } while (recent.includes(no));
    const text = FORTUNES[no - 1]; Store.addFortune(no, text); Snd.chime(.13);
    openSheet(`<h2 class="sheet-title">Thẻ của bạn</h2>
      <div class="card"><div class="no">THẺ SỐ ${no}</div><p>${text}</p><div class="small">Mang tính giải trí</div></div>
      ${resultButtons('againBtn', 'Xin thẻ khác')}`);
    $('#doneBtn').onclick = endActivity;
    $('#againBtn').onclick = () => { if (motionOK) addMotion(); startQue(); };
  };
  const id = Game.actId;
  walkTo(-9.5, -15.25, 2.4).then(() => {
    if (id !== Game.actId) return;
    faceTo(-9.5, -17); Player.pose = 'pray'; focusOn(-9.5, 1.5, -16.4, -.55, .2, 4.8);
  });
  startQue();
}

/* ===== HOẠT ĐỘNG 8: XEM LÁ SỐ (giải trí) – lập bàn 12 cung bằng thư viện mã nguồn mở iztro (MIT), lời bình chỉ nói về tính cách =====

const IZTRO_URL = 'https://cdn.jsdelivr.net/npm/iztro@2.5.8/+esm'; // chỉ tải khi mở Đình Lá Số

function captureScene(ctx, W, H) {

  const saved = { x: Player.group.position.x, y: Player.group.position.y, z: Player.group.position.z, ry: Player.group.rotation.y };
  const markers = Game.zones.map(z => z.sprite.visible); Game.zones.forEach(z => { z.sprite.visible = false; });
  Player.tag.visible = false; if (Player.mood) Player.mood.visible = false; Net.setTagsVisible(false);
  Player.group.position.set(0, 0, 24); Player.group.rotation.y = Math.PI;
  const famSaved = Family.list.map(m => { const g = m.C.group, s = [g.position.x, g.position.y, g.position.z, g.rotation.y]; g.position.set(m.d.side * 1.25, 0, 24.7); g.rotation.y = Math.PI; return s; });
  const uS = U.uScale.value, uP = U.uPR.value; U.uScale.value = H / 800; U.uPR.value = 1;
  renderer.setPixelRatio(1); renderer.setSize(W, H, false);
  renderer.render(scene, shot);
  ctx.drawImage(renderer.domElement, 0, 0, W, H);
  renderer.setPixelRatio(pr); renderer.setSize(cw, ch);
  U.uScale.value = uS; U.uPR.value = uP;
  Family.list.forEach((m, k) => { const s = famSaved[k]; m.C.group.position.set(s[0], s[1], s[2]); m.C.group.rotation.y = s[3]; });
  Player.group.position.set(saved.x, saved.y, saved.z); Player.group.rotation.y = saved.ry; Player.tag.visible = !Game.busy; Net.setTagsVisible(true);
  Game.zones.forEach((z, i) => { z.sprite.visible = markers[i]; });
  if(World.composer && World.bloomPass && Game.started){
    // Update bloom strength based on time of day
    World.bloomPass.strength = 0.22 + U.uGlow.value*0.18 + U.uNight.value*0.12;
    World.composer.render();
  } else {
    renderer.render(scene, camera);
  }
}
