<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#3b2340">
<title>Cả nhà Lên Chùa</title>
<script type="importmap">
{ "imports": { 
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<style>
/* ===== UPGRADED GRAPHICS 2025 - Premium Temple Aesthetic ===== */
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap');
:root{
  --ink:#2b1d16; --ink2:#7a5f4a; --paper:#fff7e8; --paper2:#fbeccd; --line:#e7cfa3;
  --gold:#f3c15d; --gold2:#c68a28; --gold-glow:rgba(243,193,93,.45);
  --red:#b52e1c; --red2:#7a1e12; --red-glow:rgba(181,46,28,.35);
  --lam:#6d8ab0; --teal:#7bd4c0;
  --serif:"Fraunces",Georgia,serif;
  --sans:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --glass:rgba(255,247,232,.78);
  --glass-strong:rgba(255,247,232,.92);
  --glass-dark:rgba(34,18,28,.62);
  --glass-dark-strong:rgba(34,18,28,.78);
  --shadow-soft:0 10px 40px rgba(42,18,30,.18), 0 2px 12px rgba(42,18,30,.12);
  --shadow-lift:0 18px 50px rgba(42,18,30,.24), 0 4px 18px rgba(42,18,30,.16);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(120% 120% at 50% 10%, #4a2d5a 0%, #2a1a30 55%, #1a0f1c 100%);color:var(--ink);font-family:var(--sans);
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:3px;box-shadow:0 0 0 6px var(--gold-glow)}
input,textarea{font:inherit;-webkit-user-select:text;user-select:text}
#stage{position:fixed;inset:0;touch-action:none;filter:saturate(1.05) contrast(1.02)}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.hide{display:none!important}

/* Buttons Premium */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border-radius:16px;
  font-weight:700;font-size:16.5px;letter-spacing:.01em;background:var(--glass);color:var(--ink);border:1px solid rgba(231,207,163,.65);
  backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
  box-shadow:var(--shadow-soft), inset 0 1px 0 rgba(255,255,255,.7);transition:all .22s cubic-bezier(.2,.8,.2,1)}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-lift), inset 0 1px 0 rgba(255,255,255,.8);filter:brightness(1.02)}
.btn:active{transform:translateY(1px) scale(.98);filter:brightness(.97);transition-duration:.08s}
.btn.main{background:linear-gradient(180deg,#d44a33 0%,#a82a1a 100%);color:#fff6e0;border-color:rgba(255,230,190,.0);
  box-shadow:0 4px 0 var(--red2), 0 12px 28px var(--red-glow), inset 0 1px 0 rgba(255,255,255,.35);text-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn.main:hover{box-shadow:0 5px 0 var(--red2), 0 16px 36px var(--red-glow), inset 0 1px 0 rgba(255,255,255,.45);transform:translateY(-2px)}
.btn.main:active{box-shadow:0 1px 0 var(--red2), 0 4px 12px var(--red-glow);transform:translateY(2px)}
.btn.ghost{background:rgba(255,247,232,.12);color:var(--paper2);border-color:rgba(255,236,203,.18);backdrop-filter:blur(12px)}
.btn.ghost:hover{background:rgba(255,247,232,.18);color:#fff}
.btn.wide{width:100%}
.btn[disabled]{opacity:.55;cursor:default;transform:none!important}
.row{display:flex;gap:12px}
.row>.btn{flex:1;padding:0 14px}

/* Welcome - Cinematic */
#welcome{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:calc(6vh + var(--sat)) 22px calc(20px + var(--sab));text-align:center;color:#fff3dc;overflow:hidden;
  background:radial-gradient(120% 80% at 50% 15%, #ffe7a8 0%, #ffb56a 18%, #e96d4a 34%, #8a3d6a 52%, #3a2245 68%, #221425 85%);
  transition:opacity .9s cubic-bezier(.4,0,.2,1), transform .9s cubic-bezier(.4,0,.2,1)}
#welcome::before{content:'';position:absolute;inset:-20%;background:
  radial-gradient(40% 40% at 30% 20%, rgba(255,255,255,.18) 0%, transparent 60%),
  radial-gradient(50% 50% at 80% 30%, rgba(255,180,100,.22) 0%, transparent 60%),
  radial-gradient(60% 60% at 50% 80%, rgba(90,40,80,.5) 0%, transparent 70%);
  animation:drift 18s ease-in-out infinite alternate;pointer-events:none}
@keyframes drift{0%{transform:translate3d(-2%,-1%,0) scale(1)}100%{transform:translate3d(2%,1.5%,0) scale(1.05)}}
#welcome.out{opacity:0;pointer-events:none;transform:scale(1.04);filter:blur(8px)}
#welcome svg.sil{position:absolute;left:50%;top:54%;width:min(680px,118vw);transform:translate(-50%,-99.5%);pointer-events:none;filter:drop-shadow(0 12px 24px rgba(0,0,0,.4))}
#welcome .sun{position:absolute;left:50%;top:54%;width:260px;height:260px;margin:-170px 0 0 -130px;border-radius:50%;clip-path:inset(0 0 50px 0);
  background:radial-gradient(circle at 50% 45%, #fff6d0 0%, #ffdd8a 22%, #ff9a4a 48%, rgba(255,110,40,.0) 72%);
  box-shadow:0 0 80px rgba(255,200,100,.55), 0 0 140px rgba(255,140,60,.25);pointer-events:none;animation:sunPulse 4s ease-in-out infinite}
@keyframes sunPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.wbox{position:relative;width:min(400px,100%);height:100%;display:flex;flex-direction:column;gap:14px;z-index:1}
.wbox .game{font-size:12.5px;letter-spacing:.22em;text-transform:uppercase;color:#ffdfa6;font-weight:700;opacity:.9;text-shadow:0 1px 12px rgba(0,0,0,.4)}
.wbox h1{font-family:var(--serif);font-weight:700;font-size:clamp(36px,11vw,54px);white-space:nowrap;line-height:.95;margin:2px 0 4px;letter-spacing:-.02em;
  text-shadow:0 2px 0 rgba(0,0,0,.15), 0 8px 32px rgba(40,10,40,.6), 0 0 40px rgba(255,220,160,.25)}
.wform{margin-top:auto;display:flex;flex-direction:column;gap:14px;padding:20px 18px 18px;background:var(--glass);border:1px solid rgba(255,236,203,.7);
  border-radius:24px;backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);
  box-shadow:var(--shadow-lift), inset 0 1px 0 rgba(255,255,255,.8)}
.wbox label{font-size:13.5px;text-align:left;color:var(--ink2);font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.wbox input{height:54px;border-radius:14px;border:1.5px solid var(--line);background:rgba(255,255,255,.88);padding:0 16px;
  font-size:17px;color:var(--ink);width:100%;box-shadow:inset 0 2px 8px rgba(90,60,20,.06);transition:all .2s}
.wbox input:focus{border-color:var(--gold2);background:#fff;box-shadow:inset 0 2px 8px rgba(90,60,20,.04), 0 0 0 4px var(--gold-glow)}
.wbox .btn.main{min-height:62px;font-size:20px;font-family:var(--serif);letter-spacing:.01em;border-radius:18px}
#wstatus{min-height:20px;font-size:13.5px;color:var(--ink2);font-weight:600}
.wnote{font-size:12px;color:#8a6d52;line-height:1.5;font-weight:500}

/* Appearance picker premium */
.looks{display:flex;flex-direction:column;gap:10px}
.lrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.sw{width:42px;height:42px;border-radius:50%;border:3px solid rgba(255,240,210,.7);box-shadow:0 2px 8px rgba(0,0,0,.12), inset 0 1px 2px rgba(255,255,255,.6);transition:all .2s cubic-bezier(.2,.8,.2,1)}
.sw:hover{transform:scale(1.08) translateY(-1px)}
.sw.sel{border-color:#fff;box-shadow:0 0 0 3px var(--red), 0 6px 16px rgba(165,48,31,.35);transform:scale(1.12)}
.sw.sm{width:32px;height:32px}
.hc{min-height:36px;padding:0 14px;border-radius:20px;background:rgba(90,50,20,.08);color:var(--ink);font-size:13px;font-weight:700;border:1.5px solid transparent;transition:all .2s;backdrop-filter:blur(8px)}
.hc:hover{transform:translateY(-1px);background:rgba(90,50,20,.12)}
.hc.sel{background:linear-gradient(180deg,#fff8e6,#f6e6cb);color:var(--ink);border-color:var(--gold);box-shadow:0 4px 12px rgba(182,134,44,.22), inset 0 1px 0 #fff}
.lname{font-size:12.5px;color:var(--ink2);min-height:16px;text-align:center;font-weight:600}
.wbox label.fam,.fam{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;color:var(--ink);text-align:center;font-weight:600}
.fam input{width:20px;height:20px;accent-color:var(--red)}
.pagemain .hc{background:var(--paper2);color:var(--ink)} .pagemain .hc.sel{background:#fff0e3;border-color:var(--red)}
.pagemain .sw{border-color:var(--line)} .pagemain .sw.sel{border-color:var(--gold2)}
.pagemain .lname{color:var(--ink2)} .pagemain .wbox label.fam,.pagemain .fam{color:var(--ink)}

/* HUD Glass Premium */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none}
#counter{position:absolute;left:calc(14px + var(--sal));top:calc(14px + var(--sat));max-width:calc(100vw - 260px);padding:10px 14px;border-radius:16px;
  background:var(--glass-dark);color:#ffeccb;font-size:12.5px;line-height:1.4;backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);
  border:1px solid rgba(255,236,203,.14);box-shadow:0 8px 24px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.12)}
#counter b{color:var(--gold);font-weight:800;text-shadow:0 0 12px var(--gold-glow)}
#netLine{margin-top:4px;color:#a9e6d6;font-weight:600}
#clockLine{margin-top:3px;color:#ffe2a6;font-weight:600}
#tools{position:absolute;right:calc(12px + var(--sar));top:calc(12px + var(--sat));display:flex;gap:8px;pointer-events:auto}
.tool{min-width:48px;height:48px;padding:0 12px;border-radius:14px;background:var(--glass-dark);color:#ffeccb;font-size:13px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid rgba(255,236,203,.14);
  backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);
  box-shadow:0 8px 24px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.1);transition:all .2s cubic-bezier(.2,.8,.2,1)}
.tool:hover{transform:translateY(-1px);background:var(--glass-dark-strong);box-shadow:0 12px 32px rgba(0,0,0,.28)}
.tool:active{transform:translateY(1px) scale(.97)}
.tool svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
#joy{position:absolute;left:calc(22px + var(--sal));bottom:calc(28px + var(--sab));width:142px;height:142px;border-radius:50%;pointer-events:auto;touch-action:none;
  background:radial-gradient(100% 100% at 35% 30%, rgba(255,247,232,.22) 0%, rgba(255,247,232,.08) 55%, rgba(40,22,30,.18) 100%);
  border:1.5px solid rgba(255,240,210,.28);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);
  box-shadow:0 12px 32px rgba(0,0,0,.22), inset 0 1px 1px rgba(255,255,255,.18), inset 0 -8px 20px rgba(0,0,0,.18)}
#joy #knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;
  background:radial-gradient(100% 100% at 35% 25%, #fff7e8 0%, #f6e6cb 45%, #e3cda8 100%);
  box-shadow:0 4px 12px rgba(0,0,0,.2), 0 1px 2px rgba(0,0,0,.2), inset 0 1px 1px #fff;transition:transform .08s}
#moodBtn{position:absolute;left:calc(22px + var(--sal));bottom:calc(184px + var(--sab));min-height:44px;max-width:min(64vw,320px);padding:0 16px 0 12px;border-radius:22px;pointer-events:auto;
  background:var(--glass-dark);color:#ffeccb;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;
  border:1px solid rgba(255,236,203,.14);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 8px 24px rgba(0,0,0,.22)}
#moodBtn svg{flex:none;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Action Button - Hero */
#action{position:absolute;right:calc(22px + var(--sar));bottom:calc(28px + var(--sab));min-height:56px;min-width:132px;padding:0 20px;border-radius:28px;pointer-events:auto;
  background:linear-gradient(180deg,#f0c35a,#d89a2a);color:#3a2416;font-weight:800;font-size:16px;letter-spacing:.01em;
  box-shadow:0 4px 0 #9a6a1a, 0 12px 28px rgba(243,193,93,.45), inset 0 1px 0 rgba(255,255,255,.7);
  border:1px solid rgba(255,255,255,.3);transition:all .18s cubic-bezier(.2,.8,.2,1);animation:actionFloat 3s ease-in-out infinite}
@keyframes actionFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
#action:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 6px 0 #9a6a1a, 0 16px 36px rgba(243,193,93,.55)}
#action:active{transform:translateY(2px) scale(.98);box-shadow:0 1px 0 #9a6a1a, 0 4px 12px rgba(243,193,93,.35)}

/* Toast & Bubbles */
#toast{position:absolute;left:50%;bottom:calc(110px + var(--sab));transform:translateX(-50%);max-width:min(88vw,420px);padding:12px 18px;border-radius:18px;
  background:var(--glass-strong);color:var(--ink);font-size:14.5px;font-weight:600;line-height:1.45;text-align:center;
  border:1px solid rgba(231,207,163,.7);box-shadow:var(--shadow-lift), inset 0 1px 0 #fff;
  backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);pointer-events:none;opacity:0;transition:all .4s cubic-bezier(.2,.8,.2,1)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(-8px)}
#caption{position:absolute;left:50%;top:calc(22% + var(--sat));transform:translateX(-50%);max-width:min(90vw,520px);padding:14px 20px;border-radius:20px;
  background:var(--glass-strong);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.5;text-align:center;
  border:1px solid rgba(231,207,163,.7);box-shadow:var(--shadow-lift);backdrop-filter:blur(20px)}

/* Sheets & Pages */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;transform:translateY(110%);transition:transform .5s cubic-bezier(.32,.72,0,1);
  padding:0 calc(10px + var(--sal)) calc(10px + var(--sab)) calc(10px + var(--sar));pointer-events:none}
#sheet.open{transform:translateY(0);pointer-events:auto}
#sheetBody{background:var(--glass-strong);border:1px solid rgba(231,207,163,.7);border-radius:24px 24px 20px 20px;
  box-shadow:0 -12px 40px rgba(42,18,30,.18), var(--shadow-lift), inset 0 1px 0 #fff;
  backdrop-filter:blur(28px) saturate(1.6);-webkit-backdrop-filter:blur(28px) saturate(1.6);overflow:hidden}
.page{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;padding:0;background:rgba(26,15,28,.42);backdrop-filter:blur(12px) saturate(1.2)}
.pagebox{position:relative;width:min(520px,100%);max-height:min(92vh,900px);background:var(--glass-strong);border:1px solid rgba(231,207,163,.7);
  border-radius:28px 28px 0 0;box-shadow:0 -16px 48px rgba(42,18,30,.22);backdrop-filter:blur(28px) saturate(1.6);-webkit-backdrop-filter:blur(28px) saturate(1.6);
  display:flex;flex-direction:column;overflow:hidden;animation:pageIn .45s cubic-bezier(.32,.72,0,1)}
@keyframes pageIn{from{transform:translateY(24px) scale(.98);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 14px;border-bottom:1.5px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,247,232,.3))}
.pagehead h2{font-family:var(--serif);font-size:22px;margin:0;color:var(--ink);letter-spacing:-.01em}
.pagemain{padding:16px 18px 20px;overflow:auto;-webkit-overflow-scrolling:touch}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:linear-gradient(180deg,#fff,#fff6e5);border:1.5px solid var(--line);border-radius:18px;padding:12px 6px;text-align:center;box-shadow:0 4px 16px rgba(90,50,20,.06), inset 0 1px 0 #fff}
.stat b{display:block;font-family:var(--serif);font-size:28px;color:var(--red);text-shadow:0 1px 0 rgba(255,255,255,.8)}
.stat span{font-size:11.5px;color:var(--ink2);line-height:1.3;display:block;font-weight:700;letter-spacing:.02em;text-transform:uppercase;margin-top:2px}
.pagemain h3{font-family:var(--serif);font-size:18px;margin:18px 0 10px;color:var(--ink)}
.entry{background:linear-gradient(180deg,#fff,#fff8eb);border:1.5px solid var(--line);border-radius:16px;padding:13px 15px;margin-bottom:10px;box-shadow:0 3px 12px rgba(90,50,20,.05), inset 0 1px 0 #fff;transition:all .2s}
.entry:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(90,50,20,.08)}
.entry p{margin:0 0 6px;font-family:var(--serif);font-size:16.5px;line-height:1.45;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.entry .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink2);font-weight:600}
.entry .meta button{color:var(--red);font-weight:800;min-height:34px;padding:0 8px;border-radius:10px;transition:all .15s}
.entry .meta button:hover{background:rgba(181,46,28,.08)}
.empty{color:var(--ink2);font-size:14.5px;line-height:1.5;padding:8px 0 10px;font-weight:500}
.namerow{display:flex;gap:10px;margin-bottom:16px}
.namerow input{flex:1;min-width:0;height:50px;border-radius:14px;border:1.5px solid var(--line);padding:0 14px;font-size:17px;background:#fff;color:var(--ink);box-shadow:inset 0 2px 8px rgba(90,60,20,.06);transition:all .2s}
.namerow input:focus{border-color:var(--gold2);box-shadow:0 0 0 4px var(--gold-glow)}
#tutorial .pagebox{padding:24px 22px 18px;text-align:center}
#tutorial .step{font-size:12px;color:var(--ink2);letter-spacing:.08em;font-weight:700;text-transform:uppercase}
#tutorial h2{font-family:var(--serif);font-size:26px;margin:6px 0 10px;color:var(--red2);letter-spacing:-.01em}
#tutorial p{font-size:16.5px;line-height:1.55;margin:0 0 18px;min-height:75px;font-weight:500}
#tutorial svg{width:104px;height:104px;margin:8px auto 10px;display:block;filter:drop-shadow(0 8px 20px rgba(0,0,0,.12))}
#sharePreview{display:block;width:auto;max-width:100%;max-height:58vh;margin:0 auto 14px;border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.28);border:2px solid #fff}
#fatal{position:fixed;inset:0;z-index:60;background:radial-gradient(100% 100% at 50% 20%, #4a2d5a, #1a0f1c);color:#ffeccb;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;font-size:17px;line-height:1.6}
@media (max-height:500px){ #welcome svg.sil,#welcome .sun{display:none} #toast{bottom:calc(10px + var(--sab));max-width:42vw} }
@media (prefers-reduced-motion:reduce){#action{animation:none} #welcome::before{animation:none}}
@media (min-width:820px) and (pointer:fine){ #joy{display:none} #action{bottom:calc(40px + var(--sab));right:calc(50% - 90px);min-width:180px} #toast{bottom:150px} }

/* Premium FX Overlays */
#fx-vignette{position:fixed;inset:0;pointer-events:none;z-index:9;
  background:radial-gradient(120% 120% at 50% 50%, transparent 62%, rgba(26,15,28,.22) 86%, rgba(26,15,28,.55) 100%);
  mix-blend-mode:multiply}
#fx-grain{position:fixed;inset:-50%;pointer-events:none;z-index:9;opacity:.035;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  animation:grainShift 8s steps(10) infinite}
@keyframes grainShift{0%,100%{transform:translate(0,0)}10%{transform:translate(-5%,-5%)}20%{transform:translate(-10%,5%)}30%{transform:translate(5%,-10%)}40%{transform:translate(-5%,15%)}50%{transform:translate(-10%,10%)}60%{transform:translate(15%,0)}70%{transform:translate(0,10%)}80%{transform:translate(3%,-15%)}90%{transform:translate(-10%,10%)}}

/* ===== LỌC TỪ THÔ TỤC: so theo từng từ để không bắt nhầm các từ tiếng Việt lành như "các", "đi" ===== */
const BAD_WORDS = new Set(['đụ', 'địt', 'đéo', 'đĩ', 'lồn', 'cặc', 'buồi', 'dái', 'đm', 'dm', 'đmm', 'dmm', 'đcm', 'dcm', 'clm', 'cmm', 'vcl', 'vkl', 'vãi lồn', 'vl', 'cc', 'đcmm', 'ditme', 'địt mẹ', 'đụ má', 'đụ mẹ', 'mẹ kiếp', 'chó đẻ', 'óc chó', 'con đĩ', 'fuck', 'fucking', 'shit', 'bitch', 'asshole', 'dick', 'pussy']);
function hasBadWord(text) {
  const clean = (text || '').normalize('NFC').toLowerCase();
  const tok = clean.split(/[^\p{L}\p{N}]+/u).filter(Boolean);
  for (let i = 0; i < tok.length; i++) {
    if (BAD_WORDS.has(tok[i])) return true;
    if (i + 1 < tok.length && BAD_WORDS.has(tok[i] + ' ' + tok[i + 1])) return true;
    if (tok[i].length === 1) { // chữ cách nhau: "đ m", "v c l"
      let j = i, s = '';
      while (j < tok.length && tok[j].length === 1) s += tok[j++];
      if (BAD_WORDS.has(s)) return true;
    }
  }
  return false;
}

/* ===== ÂM THANH: toàn bộ tạo bằng Web Audio, không tải tệp ngoài ===== */
// Ngũ cung Sol từ G2 tới E5 (chỉ số 0..14)
const PENTA = [98, 110, 130.81, 146.83, 164.81, 196, 220, 261.63, 293.66, 329.63, 392, 440, 523.25, 587.33, 659.25];
const Snd = {
  ctx: null, master: null, rev: null, bgBus: null, chantBus: null, muted: !!Store.data.muted, night: 0, timers: [], musicOn: Store.data.music !== false, musicLevel: .6, tockQ: [],
  init() {
    if (this.ctx) { this.ctx.resume?.(); return; }

    // Nhiễu dùng chung
    const nlen = ctx.sampleRate * 3 | 0; this.noise = ctx.createBuffer(1, nlen, ctx.sampleRate);
    const nd = this.noise.getChannelData(0); for (let i = 0; i < nlen; i++) nd[i] = Math.random() * 2 - 1;
    ctx.resume?.();

    document.addEventListener('visibilitychange', () => { if (!this.ctx) return; document.hidden ? this.ctx.suspend() : this.ctx.resume(); });
  },
  setMuted(m) {
    this.muted = m; Store.data.muted = m; Store.save();

  },
  noiseSrc(loop = false) { const s = this.ctx.createBufferSource(); s.buffer = this.noise; s.loop = loop; if (loop) s.start(0, Math.random() * 2); return s; },
  // Tiếng minh hoạ: chim (tối thì dế), chuông xa; không còn nhiễu nền gió lá
  startBackground() {
    const c = this.ctx;
    // Đã bỏ tiếng gió và lá xào xạc (nhiễu nền liên tục): chỉ giữ nhạc thiền và tiếng minh hoạ (chim, dế, chuông, mõ)

  },
  ambientTick() {

  },

    const g = c.createGain(); g.gain.value = .05;

function updateHairBits(dt) {
  const L = HairBits.list;
  for (let i = L.length - 1; i >= 0; i--) {
    const h = L[i], p = h.m.position; h.life -= dt;
    if (p.y > h.ground) { // rơi lả tả, sức cản không khí lớn
      h.vy = Math.max(h.vy - 4 * dt, -1.4); h.vx *= 1 - 1.5 * dt; h.vz *= 1 - 1.5 * dt;
      p.x += h.vx * dt; p.z += h.vz * dt; p.y = Math.max(h.ground, p.y + h.vy * dt);

/* ===== TÂM TRẠNG: gõ vài chữ, hiện bong bóng trên đầu nhân vật; xoá chữ đi là tắt. Người cùng vào qua link cũng thấy ===== */
const MOOD_MAX = 40;

    c.beginPath(); c.moveTo(cx - 16, 6 + bh - 2); c.lineTo(cx, h - 8); c.lineTo(cx + 16, 6 + bh - 2); c.closePath(); c.fill(); // đuôi bong bóng
    c.beginPath(); c.moveTo(cx - 16, 6 + bh); c.lineTo(cx, h - 8); c.lineTo(cx + 16, 6 + bh); c.stroke();
    c.fillRect(cx - 14, 6 + bh - 5, 28, 7);

  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, fog: false }));

const Koi = { list: [], mesh: null };
const KOI_MAX = 110, KOI_COLS = ['#f0662a', '#f4f0e6', '#e8a33a', '#d8402a', '#f7d27a', '#ff8a4a', '#f4f0e6'];
function buildKoi() {
  const b = new Batch(), sm = { smooth: true, jit: 0 };
  b.add(new THREE.SphereGeometry(.5, 10, 7), '#ffffff', TRS(0, 0, 0, 0, .15, .06, .42), sm);
  b.add(new THREE.ConeGeometry(.12, .2, 4), '#ffffff', TRS(0, 0, -.27, 0, 1, .25, 1, -Math.PI / 2), { jit: 0 });
  for (const sg of [-1, 1]) b.add(new THREE.ConeGeometry(.05, .12, 3), '#ffffff', TRS(sg * .09, 0, .05, 0, 1, .2, 1, Math.PI / 2, sg * 1.1), { jit: 0 });

  const m = Koi.mesh = new THREE.InstancedMesh(Koi.geo, new THREE.MeshLambertMaterial({ vertexColors: true, transparent: true, opacity: .86, depthWrite: false }), KOI_MAX);
  m.instanceMatrix.setUsage(THREE.DynamicDrawUsage); m.frustumCulled = false; m.renderOrder = 1; scene.add(m);
  const Z = new THREE.Matrix4().makeScale(0, 0, 0), c = new THREE.Color('#fff'); for (let i = 0; i < KOI_MAX; i++) { m.setMatrixAt(i, Z); m.setColorAt(i, c); }
  for (let i = 0; i < 14; i++) addKoi(POND); for (let i = 0; i < 24; i++) addKoi(POND2); for (let i = 0; i < 22; i++) addKoi(LAKE); const p3 = { x: 75, z: -140, r: 8 }; for (let i = 0; i < 8; i++) addKoi(p3);
}
function pickKoiTarget(k) { const a = rand(0, 6.28), d = Math.sqrt(Math.random()) * (k.pond.r - 1.4); k.tx = k.pond.x + Math.cos(a) * d; k.tz = k.pond.z + Math.sin(a) * d; }
function addKoi(pond, x, z, col) {
  let i = Koi.list.length;
  if (i >= KOI_MAX) { const old = Koi.list.findIndex(k => k.pond === POND2); i = Koi.list[old].i; Koi.list.splice(old, 1); } // ao đầy thì con thả lâu nhất nhường chỗ
  const a = rand(0, 6.28), d = Math.sqrt(Math.random()) * (pond.r - 1.3);
  const k = { i, pond, x: x ?? pond.x + Math.cos(a) * d, z: z ?? pond.z + Math.sin(a) * d, ry: rand(0, 6.28), sp: rand(.3, .65), boost: 0, ph: rand(0, 6), s: rand(.8, 1.25), tx: 0, tz: 0 };
  pickKoiTarget(k); Koi.list.push(k); Koi.mesh.setColorAt(i, new THREE.Color(col || pick(KOI_COLS))); Koi.mesh.instanceColor.needsUpdate = true; return k;
}
function updateKoi(dt, t) {
  if (!Koi.mesh) return; const o = World.dummy;
  for (const k of Koi.list) {
    const dx = k.tx - k.x, dz = k.tz - k.z;
    if (dx * dx + dz * dz < .3) pickKoiTarget(k);
    k.ry = dampAngle(k.ry, Math.atan2(dx, dz), 1.4 + k.boost * 2, dt);
    const sp = k.sp * (1 + k.boost * 2.4); k.boost = Math.max(0, k.boost - dt * .35);
    k.x += Math.sin(k.ry) * sp * dt; k.z += Math.cos(k.ry) * sp * dt;
    const ex = k.x - k.pond.x, ez = k.z - k.pond.z, ed = Math.hypot(ex, ez), lim = k.pond.r - .75;
    if (ed > lim) { k.x = k.pond.x + ex / ed * lim; k.z = k.pond.z + ez / ed * lim; pickKoiTarget(k); }
    o.position.set(k.x, .118, k.z); o.rotation.set(0, k.ry + Math.sin(t * (6 + k.boost * 9) + k.ph) * .15, 0); o.scale.setScalar(k.s); o.updateMatrix(); Koi.mesh.setMatrixAt(k.i, o.matrix);
  }
  Koi.mesh.instanceMatrix.needsUpdate = true;
}
function ripple(x, z, delay = 0) {
  setTimeout(() => {
    const m = new THREE.Mesh(World.rippleGeo || (World.rippleGeo = new THREE.RingGeometry(.3, .36, 28).rotateX(-Math.PI / 2)), new THREE.MeshBasicMaterial({ color: '#fff8e8', transparent: true, opacity: .8, depthWrite: false }));

  setRing(scale, op) { this.ring.style.transform = `scale(${scale.toFixed(3)})`; this.ring.style.opacity = op; },
  judge(text) { const j = $('#rJudge'); j.textContent = text; j.classList.remove('on'); void j.offsetWidth; j.classList.add('on'); },

/* ===== HOẠT ĐỘNG 1: THẮP HƯƠNG – chọn 1 hoặc 3 nén, chắp tay, cắm vào lư, khói bay lên ===== */

async function doIncense(n) {
  closeSheet();

/* ===== HOẠT ĐỘNG 2: THỈNH CHUÔNG – chạm khi vòng sáng co đúng vòng giữa, 3 tiếng ===== */
const BELL = { x: -19, z: 20, swing: 0, swingV: 0, pull: 0, stand: [-17.4, 22.1] };
async function actBell() {
  beginActivity();
  await walkTo(BELL.stand[0], BELL.stand[1], 2.2);
  faceTo(-17, 20); Player.pose = 'strike'; Player.strikeA = .1;
  focusOn(-18, 1.5, 20.5, -.04, .16, 9.4);
  let left = 3, phase = 'pull', p = 0, pause = 0, perfect = 0;
  const DUR = 1.75;
  Rhythm.start({
    top: 'Tiếng thứ 1 trong 3', coreText: 'Chuông', coreClass: 'chuong', hint: 'Chạm khi vòng vàng khớp vòng sáng giữa',
    onTap() {
      if (phase !== 'pull') return;
      const scale = lerp(1, .26, p), diff = Math.abs(scale - .5);
      Rhythm.hitCore(); BELL.pull = 0; World.striker.rotation.z = -.03; Rhythm.setRing(.5, 0); Player.strikeA = -.2;
      if (diff < .065) { perfect++; Rhythm.judge('Tròn tiếng'); Snd.bell(.95, 13); Cam.shake = 1; BELL.swingV = .32; vibrate([40, 30, 40]); }
      else if (diff < .17) { Rhythm.judge('Ngân vừa'); Snd.bell(.6, 8); Cam.shake = .45; BELL.swingV = .18; vibrate(25); }
      else { Rhythm.judge('Khẽ thôi'); Snd.bell(.3, 4.5); BELL.swingV = .08; }
      if (diff < .17) bellHeard(); left--; phase = 'rest'; pause = left ? 2.1 : 3.4; Net.bell++;
    },
    onUpdate(dt) {
      if (phase === 'pull') {
        p += dt / DUR;
        if (p >= 1) p = 0;
        Rhythm.setRing(lerp(1, .26, p), clamp(p * 6, 0, 1)); World.striker.rotation.z = BELL.pull = p * .5; Player.strikeA = .1 + p * .25;
      } else {
        pause -= dt; World.striker.rotation.z = damp(World.striker.rotation.z, 0, 4, dt);
        if (pause <= 0) {
          if (left > 0) { phase = 'pull'; p = 0; $('#rTop').textContent = `Tiếng thứ ${4 - left} trong 3`; }
          else { phase = 'done'; Rhythm.stop(); finishBell(perfect); }
        }
      }
    },
  });
  Game.update = dt => Rhythm.onUpdate?.(dt);
}
function finishBell(perfect) {
  Game.update = null;
  const msg = perfect === 3 ? 'Cả ba tiếng đều tròn. Tiếng chuông ngân xa, lắng dần vào chiều.' : perfect > 0 ? 'Tiếng chuông ngân qua mái chùa, lắng dần vào không gian.' : 'Tiếng chuông nhẹ nhàng cũng đủ làm lòng lắng lại.';
  openSheet(`<h2 class="sheet-title">Chuông đã ngân</h2><p class="praise">${msg}</p>${resultButtons('againBtn', 'Thỉnh lần nữa')}`);
  $('#doneBtn').onclick = endActivity; $('#againBtn').onclick = () => { endActivity(); actBell(); };
}
function updateBellVisual(dt, t) {
  BELL.swingV *= Math.exp(-dt * .7); BELL.swing += dt;
  World.bell.rotation.z = Math.sin(BELL.swing * 5.1) * BELL.swingV * .25;
  World.bell.rotation.x = Math.sin(BELL.swing * 3.7) * BELL.swingV * .12;
}

/* ===== HOẠT ĐỘNG 3: GÕ MÕ TỤNG KINH – 30 giây theo vòng nhịp, chấm Tĩnh tâm / Được / Lệch nhịp ===== */
const MO_BEATS = 25, MO_GAP = 1.2;
const CHANT_LINES = ['Nam mô A Di Đà Phật', 'Nam mô Bổn Sư Thích Ca Mâu Ni Phật', 'Nam mô Quan Thế Âm Bồ Tát', 'Thở vào, tâm an', 'Thở ra, mỉm cười'];
async function actMo() {
  beginActivity();
  await walkTo(9.5, -15.25, 2.4);
  faceTo(9.5, -17); Player.pose = 'sit'; Game.sitting = true; Player.leanT = .04;
  focusOn(9.5, .95, -16.2, .62, .22, 6);
  Snd.chantFocus(true);
  const st = { i: 0, clock: -2.4, judged: new Array(MO_BEATS).fill(0), good: 0, ok: 0, off: 0, done: false, line: -1, tick: 0 };
  const beatAt = i => i * MO_GAP;
  const mark = (i, kind) => { st.judged[i] = kind; };
  const hitVisual = () => { Rhythm.hitCore(); World.mallet.rotation.x = -.55; Player.strikeA = .55; };
  Rhythm.start({
    top: 'Hít thở nhẹ…', coreText: 'Mõ', coreClass: 'mo', hint: 'Chạm khi vòng vàng khớp vòng sáng giữa', progress: true,
    onTap() {
      Snd.mo(.8); hitVisual();
      const now = st.clock + .03; // bù trễ cảm ứng
      let best = -1, bd = 1e9;
      for (let i = Math.max(0, st.i - 1); i < Math.min(MO_BEATS, st.i + 2); i++) if (!st.judged[i]) { const d = Math.abs(now - beatAt(i)); if (d < bd) { bd = d; best = i; } }
      if (best < 0 || bd > MO_GAP * .46) return; // chạm lạc giữa hai nhịp thì chỉ nghe tiếng mõ
      if (bd < .11) { mark(best, 1); st.good++; Rhythm.judge('Tĩnh tâm'); vibrate(15); }
      else if (bd < .27) { mark(best, 2); st.ok++; Rhythm.judge('Được'); }
      else { mark(best, 3); st.off++; Rhythm.judge('Lệch nhịp'); }
    },
  });
  Rhythm.setRing(1, 0);
  $('#rClose').onclick = () => { Snd.chantFocus(false); endActivity(); };
  Game.update = dt => {
    st.clock += dt; const c = st.clock;
    World.mallet.rotation.x = damp(World.mallet.rotation.x, 0, 12, dt); Player.strikeA = damp(Player.strikeA, 0, 10, dt);
    if (c < 0) { $('#rTop').textContent = c < -1.6 ? 'Hít thở nhẹ…' : c < -.8 ? 'Sẵn sàng…' : 'Theo vòng nhịp nhé'; }
    // Chuyển nhịp đã trôi qua, không chạm thì tính nhẹ là lệch
    while (st.i < MO_BEATS && c > beatAt(st.i) + MO_GAP * .46) {
      if (!st.judged[st.i]) { mark(st.i, 3); st.off++; Rhythm.judge('Lệch nhịp'); }
      st.i++;
    }
    if (st.i >= MO_BEATS) { if (!st.done) { st.done = true; finishMo(st); } return; }
    // Vòng co về nhịp kế tiếp
    const next = beatAt(st.i), ph = clamp(1 - (next - c) / MO_GAP, 0, 1.2);
    const scale = ph <= 1 ? lerp(1, .5, ph) : lerp(.5, .38, (ph - 1) / .2), op = ph < .1 ? ph * 10 : ph > 1 ? 1 - (ph - 1) * 5 : 1;
    Rhythm.setRing(scale, st.judged[st.i] ? .25 : op);
    if (c >= 0) {
      $('#rProg i').style.width = (clamp(c / (MO_BEATS * MO_GAP), 0, 1) * 100).toFixed(1) + '%';
      const line = Math.floor(c / 6) % CHANT_LINES.length; if (line !== st.line) { st.line = line; $('#rTop').textContent = CHANT_LINES[line]; }
    }
    if (st.tick < MO_BEATS && c >= beatAt(st.tick)) { st.tick++; if (Snd.ctx) Snd.tock(Snd.ctx.currentTime + .001, .1); } // nhịp dẫn rất khẽ
  };
}
function moPraise(s) {
  if (s >= 90) return 'Tiếng mõ đều như hơi thở. Lòng bạn thật an.';
  if (s >= 70) return 'Nhịp mõ nhẹ và đều, lòng cũng dịu lại.';
  if (s >= 40) return 'Có lúc nhanh, lúc chậm, như một ngày bình thường. Bạn đã ngồi lại, thế là đẹp rồi.';
  return 'Không cần vội. Ngồi xuống và thở đều cũng đã là một khoảng lặng dễ chịu.';
}
function finishMo(st) {
  Game.update = null; Rhythm.stop(); Snd.chantFocus(false);
  const score = Math.round((st.good + st.ok * .72 + st.off * .15) / MO_BEATS * 100);
  const isBest = score > Store.data.best; if (isBest) { Store.data.best = score; Store.save(); }
  Snd.chime(.14);

function actFortune() {
  // Xin quyền cảm biến ngay trong lần chạm (iOS yêu cầu)
  let motionOK = false; const DM = window.DeviceMotionEvent;
  const st = { p: 0, holding: false, last: null, clickT: 0, done: false, shakeT: 0 };
  const onMotion = e => {
    const a = e.accelerationIncludingGravity; if (!a || a.x == null) return;
    const m = Math.hypot(a.x, a.y, a.z);
    if (st.last !== null && Math.abs(m - st.last) > 7) { st.p += .1; st.shakeT = .35; }
    st.last = m;
  };
  const addMotion = () => { motionOK = true; addEventListener('devicemotion', onMotion); };
  const stopMotion = () => removeEventListener('devicemotion', onMotion);
  if (DM && typeof DM.requestPermission === 'function') DM.requestPermission().then(r => { if (r === 'granted') addMotion(); }).catch(() => {});
  else if (DM && matchMedia('(pointer:coarse)').matches) addMotion();
  beginActivity();
  faceTo(-9.5, -17);
  const startQue = () => {
    openSheet(`<h2 class="sheet-title">Xin quẻ đầu năm</h2>
      <p class="sheet-sub">Lắc nhẹ điện thoại, hoặc chạm giữ nút bên dưới cho đến khi một thẻ rơi ra.</p>
      <div id="tube"><div class="sticks"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="body">Xin quẻ</div><div id="drop"></div></div>
      <div class="bar"><i id="queBar"></i></div>
      <button class="btn main wide" id="holdBtn">Chạm giữ để lắc</button>
      <button class="btn ghost wide" id="cancelBtn" style="margin-top:6px">Để sau</button>
      <p class="small" style="text-align:center;margin:8px 0 0">Mang tính giải trí</p>`);
    const hold = $('#holdBtn'), tube = $('#tube');
    st.p = 0; st.done = false;
    hold.addEventListener('pointerdown', e => { e.preventDefault(); st.holding = true; try { hold.setPointerCapture(e.pointerId); } catch (x) { /* bỏ qua */ } });
    hold.addEventListener('pointerup', () => { st.holding = false; }); hold.addEventListener('pointercancel', () => { st.holding = false; });
    hold.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); st.holding = true; } });
    hold.addEventListener('keyup', () => { st.holding = false; });
    hold.addEventListener('contextmenu', e => e.preventDefault());
    $('#cancelBtn').onclick = () => { stopMotion(); endActivity(); };
    Game.update = dt => {
      if (st.done) return;
      if (st.holding) st.p += dt / 1.7;

      const shaking = st.holding || st.shakeT > 0;

      if (st.p >= 1) { st.done = true; st.holding = false; tube.classList.remove('shake'); revealFortune(); }
    };
  };
  const revealFortune = async () => {
    stopMotion(); Snd.click(.32, 900); $('#drop').classList.add('go');
    await wait(950);
    const recent = Store.data.fortunes.slice(0, 8).map(f => f.no);
    let no; do { no = 1 + Math.random() * FORTUNES.length | 0; } while (recent.includes(no));
    const text = FORTUNES[no - 1]; Store.addFortune(no, text); Snd.chime(.13);
    openSheet(`<h2 class="sheet-title">Thẻ của bạn</h2>
      <div class="card"><div class="no">THẺ SỐ ${no}</div><p>${text}</p><div class="small">Mang tính giải trí</div></div>

    $('#doneBtn').onclick = endActivity;
    $('#againBtn').onclick = () => { if (motionOK) addMotion(); startQue(); };

    faceTo(-9.5, -17); Player.pose = 'pray'; focusOn(-9.5, 1.5, -16.4, -.55, .2, 4.8);

  const markers = Game.zones.map(z => z.sprite.visible); Game.zones.forEach(z => { z.sprite.visible = false; });
  Player.tag.visible = false; if (Player.mood) Player.mood.visible = false; Net.setTagsVisible(false);
  Player.group.position.set(0, 0, 24); Player.group.rotation.y = Math.PI;
  const famSaved = Family.list.map(m => { const g = m.C.group, s = [g.position.x, g.position.y, g.position.z, g.rotation.y]; g.position.set(m.d.side * 1.25, 0, 24.7); g.rotation.y = Math.PI; return s; });
  const uS = U.uScale.value, uP = U.uPR.value; U.uScale.value = H / 800; U.uPR.value = 1;
  renderer.setPixelRatio(1); renderer.setSize(W, H, false);
  renderer.render(scene, shot);

  renderer.setPixelRatio(pr); renderer.setSize(cw, ch);
  U.uScale.value = uS; U.uPR.value = uP;
  Family.list.forEach((m, k) => { const s = famSaved[k]; m.C.group.position.set(s[0], s[1], s[2]); m.C.group.rotation.y = s[3]; });
  Player.group.position.set(saved.x, saved.y, saved.z); Player.group.rotation.y = saved.ry; Player.tag.visible = !Game.busy; Net.setTagsVisible(true);
  Game.zones.forEach((z, i) => { z.sprite.visible = markers[i]; });

    World.bloomPass.strength = 0.22 + U.uGlow.value*0.18 + U.uNight.value*0.12;

  }
}

  if (Game.busy || P.auto) best = null;

  }
